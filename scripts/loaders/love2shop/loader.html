<!doctype html>
<meta charset="utf-8">
<title>Love2Shop heart loader</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: transparent; }
  #stage { display: block; }
</style>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="logo-o.js"></script>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var THEME = { white: 1, pink: 1, blue: 1 }[q.get('theme')] ? q.get('theme') : 'pink';
  var PRIMARY = '#2F49EA';
  var SECONDARY = '#E10054';

  // Frame geometry (1x). Render at a higher deviceScaleFactor for retina.
  var W = 240, H = 80;
  var CY = 40;
  var R = 25;             // outer radius of the O
  var X0 = 42, X1 = 198;  // centre of the O at the two ends of the run
  var TRACK_H = 6;
  var TAIL_MAX = 84;      // the trail behind the O at full speed

  // Timing: one loop is LOOP seconds, the O crossing once each way
  var LOOP = 4;

  var themes = {
    // On white: the O in the secondary pink, the trail in the primary blue
    pink:  { bg: '#FFFFFF', o: SECONDARY, hole: '#FFFFFF', track: '#E6E9FC', fill: PRIMARY },
    // On white: the O in the primary blue, as the master logo, the trail in pink
    white: { bg: '#FFFFFF', o: PRIMARY,   hole: '#FFFFFF', track: '#FBE0EA', fill: SECONDARY },
    // On the primary blue: the logo reversed out in white
    blue:  { bg: PRIMARY,   o: '#FFFFFF', hole: PRIMARY,   track: '#697CF0', fill: '#FFFFFF' }
  };
  var C = themes[THEME];
  var K = R / LOGO_O.r;   // logo units -> frame pixels

  var svg = document.getElementById('stage');
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

  var NS = 'http://www.w3.org/2000/svg';
  function el(name, attrs, parent) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(n);
    return n;
  }

  el('rect', { x: 0, y: 0, width: W, height: H, fill: C.bg });

  // Track and the trail the O leaves behind it
  el('rect', { x: X0, y: CY - TRACK_H / 2, width: X1 - X0, height: TRACK_H, rx: TRACK_H / 2, fill: C.track });
  var trail = el('rect', { x: X0, y: CY - TRACK_H / 2, width: 0, height: TRACK_H, rx: TRACK_H / 2, fill: C.fill });

  // The O from the logo. The heart is the logo's cut-out: drawn in the
  // background colour on top of the disc, which on a flat background is the
  // same thing and lets it beat.
  var puck = el('g', {});
  var logo = el('g', { transform: 'scale(' + K.toFixed(5) + ') translate(' + (-LOGO_O.cx) + ' ' + (-LOGO_O.cy) + ')' }, puck);
  el('path', { d: LOGO_O.disc, fill: C.o }, logo);
  var heartG = el('g', {}, logo);
  el('path', { d: LOGO_O.heart, fill: C.hole }, heartG);

  function easeInOutSine(p) { return -(Math.cos(Math.PI * p) - 1) / 2; }
  function bump(p, start, width) {          // smooth 0-1-0 bump
    var u = (p - start) / width;
    if (u <= 0 || u >= 1) return 0;
    return Math.sin(u * Math.PI);
  }

  window.setTime = function (t) {
    t = t - Math.floor(t);

    // Two legs per loop: out to the right, then back to the left. A sine ease
    // makes it swing like a pendulum, slowing into each end and flowing out again.
    var u = t * 2;
    var leg = Math.floor(u), s = u - leg;
    var dir = leg === 0 ? 1 : -1;
    var p = easeInOutSine(s);
    var x = leg === 0 ? X0 + (X1 - X0) * p : X1 - (X1 - X0) * p;

    // The trail stretches with speed, so it fades away as the O turns
    var speed = Math.sin(Math.PI * s);
    var tail = TAIL_MAX * speed;
    var a = x, b = x - dir * tail;
    var left = Math.max(X0, Math.min(a, b)), right = Math.min(X1, Math.max(a, b));
    trail.setAttribute('x', left.toFixed(3));
    trail.setAttribute('width', Math.max(0, right - left).toFixed(3));

    // Heartbeat: a lub-dub once a second
    var ph = (t * LOOP) % 1;
    var beat = bump(ph, 0.00, 0.22) + 0.55 * bump(ph, 0.24, 0.22);
    var hs = 1 + 0.10 * beat;

    puck.setAttribute('transform', 'translate(' + x.toFixed(3) + ' ' + CY + ')');
    heartG.setAttribute('transform',
      'translate(' + LOGO_O.heartCx + ' ' + LOGO_O.heartCy + ') scale(' + hs.toFixed(4) + ') translate(' + (-LOGO_O.heartCx) + ' ' + (-LOGO_O.heartCy) + ')');
  };

  window.__FRAME__ = { W: W, H: H, LOOP: LOOP };
  window.setTime(0);

  // Live preview when opened in a browser
  if (q.get('play') !== '0') {
    var start = performance.now();
    (function loop() {
      window.setTime(((performance.now() - start) / (LOOP * 1000)) % 1);
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
