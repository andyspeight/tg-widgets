<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --navy:#1B2B5B; --teal:#00B4D8; }
  * { box-sizing: border-box; }
  body {
    width: 310px; margin: 0; padding: 18px;
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #0f1830; background: #fff;
  }
  h1 { font-size: 15px; margin: 0 0 2px; color: var(--navy); letter-spacing: 0.01em; }
  p.sub { margin: 0 0 16px; color: #64748b; font-size: 12.5px; }
  button.go {
    width: 100%; border: 0; border-radius: 10px; padding: 12px;
    font: 700 14px/1 system-ui, sans-serif; color: #042b34; background: var(--teal);
    cursor: pointer; transition: background .15s ease;
  }
  button.go:hover { background: #48CAE4; }
  button.go.ghost {
    background: #fff; color: var(--navy); border: 1px solid #E2E8F0; margin-top: 8px;
  }
  button.go.ghost:hover { background: #f8fafc; }
  .err { color: #EF4444; font-size: 12px; margin-top: 10px; min-height: 14px; }
  .hint { font-size: 11.5px; color: #94a3b8; margin-top: 12px; }
</style>
</head>
<body>
  <h1>TG Slicer</h1>
  <p class="sub">Point at any component, capture it, send it to Travelgenix Sites.</p>

  <button class="go" id="activate">Start slicing this page</button>
  <button class="go ghost" id="library">My library</button>
  <div class="err" id="err"></div>

  <div class="hint">Capture a section, then Send to Travelgenix Sites, or Save to library to keep it for later.</div>

  <script src="popup.js"></script>
</body>
</html>
