<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travelgenix Scheduler</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="22" height="22">
    <h1>Scheduler</h1>
    <button id="back" class="icon-btn" title="Back to your schedulers" hidden>
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button id="refresh" class="icon-btn" title="Refresh">
      <svg viewBox="0 0 24 24"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
    </button>
  </header>

  <main id="view">
    <div class="state" id="loading">Loading your schedulers…</div>
  </main>

  <footer id="foot" hidden>
    <a id="open-bookings" href="#" target="_blank" rel="noopener">Open bookings</a>
    <span class="dot">·</span>
    <a id="open-dashboard" href="#" target="_blank" rel="noopener">Dashboard</a>
  </footer>

  <script src="panel.js"></script>
</body>
</html>
