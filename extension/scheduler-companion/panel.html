<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travelgenix Scheduler</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <h1>Travelgenix</h1>
    <button id="back" class="icon-btn" title="Back" hidden>
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button id="refresh" class="icon-btn" title="Refresh">
      <svg viewBox="0 0 24 24"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
    </button>
    <a id="open-bookings" class="icon-btn" href="#" target="_blank" rel="noopener" title="My meetings (view, reschedule, cancel)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </a>
    <a id="open-dashboard" class="icon-btn" href="#" target="_blank" rel="noopener" title="Open dashboard">
      <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>
  </header>

  <div id="account" class="account" hidden>
    <span class="avatar" id="avatar">A</span>
    <span class="acct-text">
      <span class="acct-name" id="acct-name"></span>
      <span class="acct-email" id="acct-email"></span>
    </span>
  </div>

  <main id="view">
    <div class="state">Loading your meetings…</div>
  </main>

  <nav id="tabs" hidden>
    <button class="tab is-on" data-tab="meetings">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><line x1="8" y1="2.5" x2="8" y2="6.5"/><line x1="16" y1="2.5" x2="16" y2="6.5"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><path d="M9 15.5l2 2 4-4"/></svg>
      Meetings
    </button>
    <button class="tab" data-tab="agenda">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
      Coming up
    </button>
  </nav>

  <script src="panel.js"></script>
</body>
</html>
