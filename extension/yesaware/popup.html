<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { width: 264px; margin: 0; font: 14px/1.5 Inter, -apple-system, 'Segoe UI', sans-serif; color: #0F172A; background: #fff; }
  .h { display: flex; align-items: center; gap: 9px; padding: 14px 16px; border-bottom: 1px solid #E2E8F0; }
  .h .ico { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #1B2B5B, #2C4173); display: flex; align-items: center; justify-content: center; color: #fff; }
  .h b { font-size: 14px; }
  .b { padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row label { font-weight: 600; font-size: 13px; }
  a.btn { display: block; text-align: center; text-decoration: none; padding: 9px 12px; border-radius: 8px; background: #1B2B5B; color: #fff; font-weight: 600; font-size: 13px; }
  a.btn.sec { background: #fff; color: #1B2B5B; border: 1px solid #E2E8F0; }
  .muted { color: #64748B; font-size: 12px; margin: 0; }
  .sw { position: relative; width: 38px; height: 22px; flex: 0 0 auto; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sl { position: absolute; inset: 0; background: #CBD5E1; border-radius: 999px; transition: .15s; cursor: pointer; }
  .sl:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  input:checked + .sl { background: #00B4D8; }
  input:checked + .sl:before { transform: translateX(16px); }
</style>
</head>
<body>
  <div class="h">
    <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg></span>
    <b>YesAware</b>
  </div>
  <div class="b">
    <div class="row">
      <label for="auto">Auto-track new emails</label>
      <span class="sw"><input type="checkbox" id="auto"><span class="sl"></span></span>
    </div>
    <p class="muted">When on, the send-time hook tracks every email you send. When off, use the Track button in each compose window.</p>
    <a class="btn" id="dash" href="#" target="_blank" rel="noopener">Open dashboard</a>
    <a class="btn sec" id="tpl" href="#" target="_blank" rel="noopener">Manage templates</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
