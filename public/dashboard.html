<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · Travelgenix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --tg-primary: #1B2B5B; --tg-primary-light: #2A3F7A; --tg-primary-dark: #111D3E;
      --tg-accent: #00B4D8; --tg-accent-light: #48CAE4; --tg-accent-dark: #0096B7;
      --tg-success: #10B981; --tg-warning: #F59E0B; --tg-error: #EF4444; --tg-info: #3B82F6;
      --tg-bg-primary: #FFFFFF; --tg-bg-secondary: #F8FAFC; --tg-bg-tertiary: #F1F5F9;
      --tg-border: #E2E8F0; --tg-border-light: #F1F5F9;
      --tg-text-primary: #0F172A; --tg-text-secondary: #475569; --tg-text-tertiary: #94A3B8;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;
      --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.10);
    }
    [data-theme="dark"] {
      --tg-bg-primary: #0F172A; --tg-bg-secondary: #1E293B; --tg-bg-tertiary: #334155;
      --tg-border: #334155; --tg-border-light: #1E293B;
      --tg-text-primary: #F8FAFC; --tg-text-secondary: #CBD5E1; --tg-text-tertiary: #64748B;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px; line-height: 1.6;
      color: var(--tg-text-primary);
      background: var(--tg-bg-secondary);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .topbar {
      background: var(--tg-bg-primary);
      border-bottom: 1px solid var(--tg-border);
      padding: 0 var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .logo {
      display: flex; align-items: center; gap: var(--space-2);
      font-weight: 700; font-size: 18px; color: var(--tg-primary);
    }
    [data-theme="dark"] .logo { color: var(--tg-accent-light); }
    .logo-mark {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--tg-primary), var(--tg-accent));
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 15px;
    }

    .topbar-right { display: flex; align-items: center; gap: var(--space-3); }
    .user-chip {
      display: flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: var(--tg-bg-tertiary);
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--tg-text-secondary);
    }
    .signout-btn {
      background: transparent;
      border: 1px solid var(--tg-border);
      color: var(--tg-text-secondary);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }
    .signout-btn:hover { background: var(--tg-bg-tertiary); color: var(--tg-text-primary); }
    .theme-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; padding: 0;
      background: transparent;
      border: 1px solid var(--tg-border);
      color: var(--tg-text-secondary);
      border-radius: var(--radius-md);
      cursor: pointer;
    }
    .theme-btn:hover { background: var(--tg-bg-tertiary); color: var(--tg-text-primary); }
    .theme-btn svg { width: 18px; height: 18px; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-12) var(--space-6) var(--space-12);
    }

    .greeting {
      margin-bottom: var(--space-8);
    }
    .greeting h1 {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 var(--space-2);
      letter-spacing: -0.02em;
    }
    .greeting p {
      margin: 0;
      color: var(--tg-text-secondary);
      font-size: 15px;
    }

    /* ─── Launchpad hero + stats (moved from the retired /home page) ─────── */
    .hero {
      background: var(--tg-bg-primary);
      border: 1px solid var(--tg-border);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      margin-bottom: var(--space-6);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -40%; right: -10%;
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(0, 180, 216, 0.06) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--tg-text-tertiary);
      margin-bottom: var(--space-2);
    }
    .hero-title {
      font-size: 32px; font-weight: 700; letter-spacing: -0.025em;
      color: var(--tg-text-primary);
      margin: 0 0 var(--space-2); line-height: 1.15;
      position: relative;
    }
    .hero-meta {
      display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2);
      margin-bottom: var(--space-4);
      position: relative;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px; font-weight: 500;
    }
    .pill-status-active { background: rgba(16, 185, 129, 0.10); color: var(--tg-success); }
    .pill-status-suspended { background: rgba(148, 163, 184, 0.18); color: var(--tg-text-tertiary); }
    .pill-status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill-pkg {
      background: rgba(0, 180, 216, 0.10);
      color: var(--tg-accent-dark);
      font-weight: 600;
    }
    [data-theme="dark"] .pill-pkg { color: var(--tg-accent-light); }
    .hero-greeting {
      font-size: 15px; color: var(--tg-text-secondary);
      position: relative;
      max-width: 640px;
      margin: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }
    .stat {
      background: var(--tg-bg-primary);
      border: 1px solid var(--tg-border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }
    .stat-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--tg-text-tertiary);
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 18px; font-weight: 600;
      color: var(--tg-text-primary);
      letter-spacing: -0.01em;
    }
    .stat-sub {
      font-size: 12px; color: var(--tg-text-tertiary);
      margin-top: 2px;
    }

    /* ─── Company switcher (multi-company users) — moved from /home ──────── */
    .switcher { position: relative; }
    .switcher[hidden] { display: none; }
    .switcher-trigger {
      display: inline-flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 12px;
      background: var(--tg-bg-tertiary);
      border: 1px solid var(--tg-border);
      border-radius: var(--radius-md);
      color: var(--tg-text-primary);
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      max-width: 220px;
    }
    .switcher-trigger:hover { background: var(--tg-bg-primary); border-color: var(--tg-accent); }
    .switcher-trigger:focus-visible { outline: 2px solid var(--tg-accent); outline-offset: 2px; }
    .switcher-icon {
      width: 16px; height: 16px;
      color: var(--tg-text-secondary);
      flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .switcher-icon svg { width: 16px; height: 16px; }
    .switcher-label {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 140px;
      flex: 1; text-align: left;
    }
    .switcher-caret {
      width: 14px; height: 14px;
      color: var(--tg-text-tertiary);
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .switcher-caret svg { width: 14px; height: 14px; }
    .switcher-trigger[aria-expanded="true"] .switcher-caret { transform: rotate(180deg); }
    .switcher-menu {
      position: absolute;
      top: calc(100% + 6px); right: 0;
      min-width: 280px;
      background: var(--tg-bg-primary);
      border: 1px solid var(--tg-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 6px;
      z-index: 50;
      max-height: 70vh;
      overflow-y: auto;
    }
    .switcher-menu[hidden] { display: none; }
    .switcher-menu-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--tg-text-tertiary);
      padding: 8px 12px 4px;
    }
    .switcher-option {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 10px 12px;
      background: transparent; border: 0;
      text-align: left; cursor: pointer;
      border-radius: var(--radius-md);
      font-family: inherit;
      color: var(--tg-text-primary);
      transition: background 0.1s;
    }
    .switcher-option:hover:not(:disabled) { background: var(--tg-bg-tertiary); }
    .switcher-option:focus-visible { outline: 2px solid var(--tg-accent); outline-offset: -2px; }
    .switcher-option:disabled { cursor: default; }
    .switcher-option-info { flex: 1; min-width: 0; }
    .switcher-option-name {
      font-size: 14px; font-weight: 500;
      color: var(--tg-text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .switcher-option-sub {
      font-size: 12px; color: var(--tg-text-tertiary);
      margin-top: 2px;
    }
    .switcher-option-check {
      width: 18px; height: 18px;
      color: var(--tg-accent);
      flex-shrink: 0;
      display: none;
    }
    .switcher-option[aria-selected="true"] .switcher-option-check { display: inline-flex; }
    .switcher-option-check svg { width: 18px; height: 18px; }
    .switcher-option-suspended .switcher-option-name { color: var(--tg-text-tertiary); }

    @media (max-width: 640px) {
      .switcher-label { display: none; }
      .switcher-trigger { padding: 0 8px; max-width: 56px; }
      .switcher-menu { min-width: 240px; right: -48px; }
      .user-chip { display: none; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-4);
    }

    .product-tile {
      background: var(--tg-bg-primary);
      border: 1px solid var(--tg-border);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      cursor: pointer;
      transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
      font-family: inherit;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }
    .product-tile::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--tg-primary), var(--tg-accent));
      opacity: 0;
      transition: opacity 200ms ease;
    }
    .product-tile:hover {
      border-color: var(--tg-accent);
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .product-tile:hover::after { opacity: 1; }
    .product-tile:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.2), var(--shadow-md);
    }

    /* Staff-only tile gets a subtle warm tint on the top accent bar to differentiate
       from client-facing products. The Staff pill in the header is the loud signal;
       this is the quiet one. */
    .product-tile[data-staff="true"]::after {
      background: linear-gradient(90deg, #F59E0B, #EF4444);
    }

    .product-icon {
      width: 48px; height: 48px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .product-icon[data-slug="widget_suite"]   { background: rgba(0, 180, 216, 0.12); color: var(--tg-accent-dark); }
    .product-icon[data-slug="luna_chat"]      { background: rgba(99, 102, 241, 0.12); color: #6366f1; }
    .product-icon[data-slug="luna_marketing"] { background: rgba(16, 185, 129, 0.12); color: var(--tg-success); }
    .product-icon[data-slug="luna_brain"]     { background: rgba(168, 85, 247, 0.12); color: #a855f7; }
    .product-icon[data-slug="luna_trends"]    { background: rgba(245, 158, 11, 0.12); color: var(--tg-warning); }
    .product-icon[data-slug="luna_qa"]        { background: rgba(244, 63, 94, 0.12); color: #f43f5e; }
    .product-icon[data-slug="tool_hub"]       { background: rgba(245, 158, 11, 0.12); color: var(--tg-warning); }
    .product-icon[data-slug="contract_loader"] { background: rgba(59, 130, 246, 0.12); color: #3b82f6; }
    .product-icon[data-slug="luna_travel"]    { background: rgba(20, 184, 166, 0.12); color: #14b8a6; }
    .product-icon[data-slug="onboarding"]     { background: rgba(16, 185, 129, 0.12); color: var(--tg-success); }
    .product-icon[data-slug="crm"]            { background: rgba(139, 92, 246, 0.12); color: #8b5cf6; }
    .product-icon[data-slug="support_desk"]   { background: rgba(245, 158, 11, 0.12); color: var(--tg-warning); }
    .product-icon[data-slug="back_office"]    { background: rgba(59, 130, 246, 0.12); color: #3b82f6; }

    .tile-header {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
    }
    .tile-header-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .product-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--tg-text-primary);
      margin: 0;
      line-height: 1.3;
    }

    /* Staff pill — small, warm-tinted, sits next to the title.
       Subtle enough not to dominate, clear enough to read at a glance. */
    .staff-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.15);
      color: #B45309;
      width: fit-content;
      margin-top: 2px;
    }
    [data-theme="dark"] .staff-pill {
      background: rgba(245, 158, 11, 0.18);
      color: #FCD34D;
    }
    .staff-pill svg {
      width: 10px;
      height: 10px;
      stroke-width: 2.5;
    }

    .product-description {
      font-size: 13px;
      color: var(--tg-text-secondary);
      margin: 0;
      line-height: 1.5;
      flex: 1;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: var(--space-3);
      border-top: 1px solid var(--tg-border-light);
    }
    .role-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--tg-bg-tertiary);
      color: var(--tg-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .open-arrow {
      font-size: 13px;
      font-weight: 500;
      color: var(--tg-accent-dark);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    [data-theme="dark"] .open-arrow { color: var(--tg-accent-light); }
    .product-tile:hover .open-arrow { transform: translateX(4px); transition: transform 150ms ease; }

    /* Coming-soon products: in build, registered in Control but not yet
       openable. Shown so the full Travelgenix suite is visible, with a clear
       badge and no hover lift so it doesn't read as clickable. */
    .soon-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 4px;
      background: rgba(0, 180, 216, 0.12);
      color: var(--tg-accent-dark);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    [data-theme="dark"] .soon-pill { color: var(--tg-accent-light); }
    .product-tile.is-coming-soon { cursor: default; opacity: 0.85; }
    .product-tile.is-coming-soon:hover {
      border-color: var(--tg-border);
      box-shadow: var(--shadow-sm);
      transform: none;
    }
    .product-tile.is-coming-soon:hover::after { opacity: 0; }

    .center-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: var(--space-12) var(--space-6);
      text-align: center; color: var(--tg-text-secondary);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--tg-border); border-top-color: var(--tg-accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: var(--space-4);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

    .empty-state {
      background: var(--tg-bg-primary);
      border: 1px solid var(--tg-border);
      border-radius: var(--radius-lg);
      padding: var(--space-12);
      text-align: center;
    }
    .empty-state h2 {
      margin: 0 0 var(--space-2);
      font-size: 18px;
      font-weight: 600;
      color: var(--tg-text-primary);
    }
    .empty-state p {
      margin: 0;
      color: var(--tg-text-secondary);
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .footer-note {
      margin-top: var(--space-12);
      text-align: center;
      font-size: 12px;
      color: var(--tg-text-tertiary);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <div class="logo-mark">TG</div>
      <span>Travelgenix</span>
    </div>
    <div class="topbar-right">
      <div class="switcher" id="switcher" hidden>
        <button class="switcher-trigger" id="switcher-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="switcher-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><rect x="9" y="9" width="2" height="2"/><rect x="13" y="9" width="2" height="2"/><rect x="9" y="13" width="2" height="2"/><rect x="13" y="13" width="2" height="2"/></svg>
          </span>
          <span class="switcher-label" id="switcher-current-name">Loading…</span>
          <span class="switcher-caret">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </button>
        <div class="switcher-menu" id="switcher-menu" role="listbox" hidden></div>
      </div>
      <div class="user-chip" id="user-chip" hidden>
        <span id="user-email"></span>
      </div>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch theme" title="Switch theme"></button>
      <button class="signout-btn" id="signout-btn" type="button">Sign out</button>
    </div>
  </header>

  <div class="container">
    <div id="content">
      <div class="center-state">
        <div class="spinner" role="status" aria-label="Loading your dashboard"></div>
        <p>Loading your apps&hellip;</p>
      </div>
    </div>
    <div class="footer-note">Travelgenix · Bournemouth, UK · part of Agendas Group</div>
  </div>

  <script>
    // SVG icons for each product (Lucide-style outline icons, no library needed)
    const ICONS = {
      widget_suite: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
      luna_chat: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
      luna_marketing: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>',
      luna_brain: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v14a3 3 0 1 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M9 5a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3"/><path d="M15 5a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3"/></svg>',
      luna_trends: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
      luna_qa: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c2.31 0 4.42.87 6.02 2.31"/></svg>',
      tool_hub: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
      contract_loader: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>',
      luna_travel: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>',
      onboarding: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>',
      crm: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      support_desk: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/><line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/><line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/><line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/></svg>',
      back_office: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>',
    };

    // Staff pill SVG (shield icon — denotes elevated access)
    const STAFF_PILL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[c]);
    }

    // Theme: respect saved preference, default to system
    const savedTheme = localStorage.getItem('tg-theme');
    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', savedTheme || (sysDark ? 'dark' : 'light'));

    function getGreeting() {
      const h = new Date().getHours();
      if (h < 12) return 'Good morning';
      if (h < 18) return 'Good afternoon';
      return 'Good evening';
    }

    function firstName(fullName, email) {
      if (fullName && fullName.trim().length > 0) return fullName.trim().split(/\s+/)[0];
      if (email) return email.split('@')[0];
      return 'there';
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '—';
        return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      } catch { return '—'; }
    }

    function fmtRelative(iso) {
      if (!iso) return 'Never';
      try {
        const d = new Date(iso);
        const diffMs = Date.now() - d.getTime();
        if (isNaN(diffMs)) return 'Never';
        const mins = Math.round(diffMs / 60000);
        if (mins < 1) return 'Just now';
        if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`;
        const hours = Math.round(mins / 60);
        if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
        const days = Math.round(hours / 24);
        if (days < 30) return `${days} day${days === 1 ? '' : 's'} ago`;
        return fmtDate(iso);
      } catch { return 'Never'; }
    }

    async function load() {
      try {
        const r = await fetch('/api/dashboard/me-products', { credentials: 'include' });
        if (r.status === 401) {
          window.location.href = '/signin.html?redirect=/dashboard.html';
          return;
        }
        if (!r.ok) throw new Error('me-products failed: ' + r.status);
        const data = await r.json();
        render(data);
        loadCompanies();
      } catch (err) {
        console.error('[dashboard] load failed', err);
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <h2>Could not load your apps</h2>
            <p>Try reloading the page. If this keeps happening, contact Travelgenix support.</p>
          </div>`;
      }
    }

    function render(data) {
      const u = data.user || {};
      const c = data.client || {};
      const products = Array.isArray(data.products) ? data.products : [];
      document.getElementById('user-email').textContent = u.email || '';
      document.getElementById('user-chip').hidden = !u.email;

      const statusKey = (c.status || '').toLowerCase();
      const statusClass = statusKey === 'suspended' ? 'pill-status-suspended' : 'pill-status-active';
      const statusLabel = c.status
        ? c.status.charAt(0).toUpperCase() + c.status.slice(1).toLowerCase()
        : 'Active';
      const clientName = c.clientName || u.clientName || '';

      const headerHtml = `
        <section class="hero">
          <div class="hero-eyebrow">${escapeHtml(getGreeting())}, ${escapeHtml(firstName(u.fullName, u.email))}</div>
          <h1 class="hero-title">${escapeHtml(clientName || 'Your workspace')}</h1>
          <div class="hero-meta">
            <span class="pill ${statusClass}"><span class="pill-status-dot"></span>${escapeHtml(statusLabel)}</span>
            ${c.packageName ? `<span class="pill pill-pkg">${escapeHtml(c.packageName)} plan</span>` : ''}
          </div>
          <p class="hero-greeting">Welcome back. Launch any of your tools below. Your session is shared across them, so you won't need to sign in again.</p>
        </section>
        <section class="stats">
          <div class="stat">
            <div class="stat-label">Signed in as</div>
            <div class="stat-value">${escapeHtml(u.fullName || u.email || '—')}</div>
            ${u.fullName ? `<div class="stat-sub">${escapeHtml(u.email || '')}</div>` : ''}
          </div>
          <div class="stat">
            <div class="stat-label">Last login</div>
            <div class="stat-value">${escapeHtml(fmtRelative(u.lastLogin))}</div>
            ${u.lastLogin ? `<div class="stat-sub">${escapeHtml(fmtDate(u.lastLogin))}</div>` : ''}
          </div>
          <div class="stat">
            <div class="stat-label">Member since</div>
            <div class="stat-value">${escapeHtml(fmtDate(c.createdAt))}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Products</div>
            <div class="stat-value">${products.length}</div>
            <div class="stat-sub">${products.length === 1 ? 'tool available' : 'tools available'}</div>
          </div>
        </section>
      `;

      if (products.length === 0) {
        document.getElementById('content').innerHTML = headerHtml + `
          <div class="empty-state">
            <h2>No apps yet</h2>
            <p>You don't have access to any Travelgenix apps. If this looks wrong, contact your account owner or Travelgenix support.</p>
          </div>
        `;
        return;
      }

      const tilesHtml = products.map(p => {
        const staffPill = p.staff
          ? `<span class="staff-pill" title="Travelgenix staff only">${STAFF_PILL_ICON}Staff</span>`
          : '';
        const soon = !!p.comingSoon;
        const hasUrl = !!p.url;
        // A tile is clickable when it has a URL. In-build (coming soon)
        // products with a temporary preview URL open for staff in a new tab
        // with a "Preview" badge; those with no URL yet stay non-clickable
        // with a "Coming soon" badge.
        const tag = hasUrl ? 'a' : 'div';
        const hrefAttr = hasUrl ? ` href="${escapeHtml(p.url)}"` : '';
        const targetAttr = (soon && hasUrl) ? ' target="_blank" rel="noopener noreferrer"' : '';
        const openArrow = `<span class="open-arrow">Open
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </span>`;
        let footer;
        if (soon) {
          footer = hasUrl
            ? `<div class="product-footer"><span class="soon-pill">Preview</span>${openArrow}</div>`
            : `<div class="product-footer"><span class="soon-pill">Coming soon</span></div>`;
        } else {
          footer = `<div class="product-footer">
              <span class="role-pill">${escapeHtml(p.roleLabel)}</span>
              ${openArrow}
            </div>`;
        }
        return `
          <${tag} class="product-tile${soon && !hasUrl ? ' is-coming-soon' : ''}"${hrefAttr}${targetAttr} data-slug="${escapeHtml(p.slug)}" data-staff="${p.staff ? 'true' : 'false'}">
            <div class="tile-header">
              <div class="product-icon" data-slug="${escapeHtml(p.slug)}">${ICONS[p.slug] || ICONS.tool_hub}</div>
              <div class="tile-header-body">
                <h3 class="product-title">${escapeHtml(p.name)}</h3>
                ${staffPill}
              </div>
            </div>
            <p class="product-description">${escapeHtml(p.description)}</p>
            ${footer}
          </${tag}>
        `;
      }).join('');

      document.getElementById('content').innerHTML = headerHtml + `
        <div class="product-grid">${tilesHtml}</div>
      `;
    }

    document.getElementById('signout-btn').addEventListener('click', async () => {
      try {
        await fetch('/api/auth/signout', { method: 'POST', credentials: 'include' });
      } catch {}
      // Also clear localStorage (set by signin.html for the widgets dashboard)
      try {
        localStorage.removeItem('tg_token');
        localStorage.removeItem('tg_user');
        localStorage.removeItem('tg_client');
      } catch {}
      window.location.href = '/signin.html';
    });

    // Light/dark toggle. The theme persists in localStorage ('tg-theme') and
    // is read on load above. The button shows a sun in dark mode (click for
    // light) and a moon in light mode (click for dark).
    const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
    const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    function applyThemeButton() {
      const btn = document.getElementById('theme-btn');
      if (!btn) return;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.innerHTML = isDark ? SUN_ICON : MOON_ICON;
      const label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    }
    document.getElementById('theme-btn').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('tg-theme', next); } catch {}
      applyThemeButton();
    });
    applyThemeButton();

    // ─── Company switcher (multi-company users) — moved from the old /home ──
    // Only shows when the signed-in person is linked to more than one client
    // company. Picking one POSTs /api/auth/switch-client and reloads.
    let companyList = [];
    let currentClientId = null;
    let menuOpen = false;
    let switching = false;

    function loadCompanies() {
      fetch('/api/auth/companies', {
        credentials: 'include',
        headers: { 'Accept': 'application/json' },
      })
        .then((r) => r.ok ? r.json() : null)
        .then((data) => {
          if (!data || data.ok === false) return;
          companyList = data.companies || [];
          currentClientId = data.currentClientId || null;
          renderSwitcher();
        })
        .catch((err) => {
          console.warn('[dashboard] companies load failed:', err.message);
        });
    }

    function renderSwitcher() {
      const wrap = document.getElementById('switcher');
      const currentLabel = document.getElementById('switcher-current-name');
      const menu = document.getElementById('switcher-menu');
      if (!wrap || !currentLabel || !menu) return;

      // Only show the switcher if the user has more than one linked company.
      if (!Array.isArray(companyList) || companyList.length < 2) {
        wrap.hidden = true;
        return;
      }
      wrap.hidden = false;

      const current = companyList.find((c) => c.current) || companyList[0];
      currentLabel.textContent = current.name || 'Workspace';
      currentLabel.title = current.name || '';

      menu.innerHTML = `
        <div class="switcher-menu-label">Your companies</div>
        ${companyList.map((c) => {
          const isCurrent = c.id === currentClientId;
          const isSuspended = (c.status || '').toLowerCase() === 'suspended';
          const sub = [c.packageName ? `${c.packageName} plan` : '', isSuspended ? 'Suspended' : '']
            .filter(Boolean).join(' · ');
          return `
            <button
              class="switcher-option ${isSuspended ? 'switcher-option-suspended' : ''}"
              role="option"
              aria-selected="${isCurrent}"
              data-client-id="${escapeHtml(c.id)}"
              ${isCurrent || isSuspended ? 'disabled' : ''}
              type="button"
            >
              <span class="switcher-option-info">
                <div class="switcher-option-name">${escapeHtml(c.name || '(unnamed)')}</div>
                ${sub ? `<div class="switcher-option-sub">${escapeHtml(sub)}</div>` : ''}
              </span>
              <span class="switcher-option-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
            </button>`;
        }).join('')}
      `;
    }

    function setMenuOpen(open) {
      menuOpen = open;
      const trigger = document.getElementById('switcher-trigger');
      const menu = document.getElementById('switcher-menu');
      if (!trigger || !menu) return;
      trigger.setAttribute('aria-expanded', String(open));
      menu.hidden = !open;
    }

    document.addEventListener('click', (e) => {
      const trigger = e.target.closest('#switcher-trigger');
      const option = e.target.closest('.switcher-option');
      const insideSwitcher = e.target.closest('#switcher');

      if (trigger) {
        e.preventDefault();
        setMenuOpen(!menuOpen);
        return;
      }

      if (option && !option.disabled && !switching) {
        e.preventDefault();
        const targetId = option.dataset.clientId;
        if (targetId && targetId !== currentClientId) {
          switchToCompany(targetId);
        }
        return;
      }

      if (menuOpen && !insideSwitcher) {
        setMenuOpen(false);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menuOpen) {
        setMenuOpen(false);
        const trigger = document.getElementById('switcher-trigger');
        if (trigger) trigger.focus();
      }
    });

    function switchToCompany(clientId) {
      switching = true;
      const trigger = document.getElementById('switcher-trigger');
      const currentLabel = document.getElementById('switcher-current-name');
      const previousLabel = currentLabel.textContent;
      currentLabel.textContent = 'Switching…';
      if (trigger) trigger.disabled = true;

      fetch('/api/auth/switch-client', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ clientId }),
      })
        .then((r) => r.json().then((d) => ({ status: r.status, body: d })))
        .then(({ status, body }) => {
          if (status >= 200 && status < 300 && body.ok !== false) {
            // New session cookie set server-side. Reload with the new context.
            location.reload();
          } else {
            const msg = (body && body.error) || `Could not switch (${status})`;
            alert(msg);
            currentLabel.textContent = previousLabel;
            if (trigger) trigger.disabled = false;
            switching = false;
          }
        })
        .catch((err) => {
          console.error('[dashboard] switch failed:', err);
          alert('Network error. Please try again.');
          currentLabel.textContent = previousLabel;
          if (trigger) trigger.disabled = false;
          switching = false;
        });
    }

    load();
  </script>
  <!-- Travelgenix staff act-as pill + acting-as banner. Self-gating: renders
       nothing for non-staff. Lets staff act as any client from the launchpad;
       the session is shared across .travelify.io so a switch reflects on every
       product. Moved here from the old /home page during consolidation. -->
  <script defer src="/staff-switcher.js"></script>
</body>
</html>
