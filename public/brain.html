<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna Brain — Verify knowledge</title>
  <!-- SSO + product gate. Only users with Luna Brain access (or staff) get in. -->
  <script src="https://id.travelify.io/tg-auth-gate.js" data-product="luna_brain"></script>
  <style>
    :root {
      --tg: #0ABAB5; --tg-dark: #089693;
      --ink: #0f172a; --muted: #475569; --faint: #94a3b8;
      --line: #e2e8f0; --bg: #f8fafc; --card: #fff;
      --amber: #b45309; --amber-bg: #fffbeb;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header .mark { width: 34px; height: 34px; border-radius: 9px; background: rgba(10,186,181,.12); color: var(--tg); display: grid; place-items: center; }
    header h1 { font-size: 17px; margin: 0; font-weight: 700; }
    header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    header .spacer { flex: 1; }
    header a.back { font-size: 13px; color: var(--muted); text-decoration: none; margin-left: 6px; }
    header a.back:hover { color: var(--ink); }
    main { max-width: 860px; margin: 0 auto; padding: 24px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
    .tab { background: none; border: none; padding: 10px 4px; margin-right: 16px; font: inherit; font-size: 14px; font-weight: 600; color: var(--faint); cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--ink); border-bottom-color: var(--tg); }
    .tab .pill { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 6px; font-size: 11px; line-height: 18px; border-radius: 999px; background: #eef2f7; color: var(--muted); vertical-align: middle; }
    .state { text-align: center; padding: 56px 24px; color: var(--muted); }
    .state.empty .big { font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
    .card .q { font-size: 15px; font-weight: 650; margin: 0 0 8px; }
    .card .a { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0 0 12px; white-space: pre-wrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: #f1f5f9; color: var(--muted); font-weight: 600; }
    .tag.review { background: var(--amber-bg); color: var(--amber); }
    .tag.draft { background: #eff6ff; color: #1d4ed8; }
    .tag.spot { background: #fef2f2; color: #b91c1c; }
    .gate { font-size: 12.5px; color: var(--faint); margin: 0 0 12px; font-style: italic; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button.act { font: inherit; font-size: 13.5px; font-weight: 600; border-radius: 9px; padding: 8px 14px; cursor: pointer; border: 1px solid transparent; }
    button.act:disabled { opacity: .5; cursor: default; }
    .btn-verify { background: var(--tg); color: #fff; }
    .btn-verify:hover:not(:disabled) { background: var(--tg-dark); }
    .btn-ghost { background: #fff; color: var(--muted); border-color: var(--line); }
    .btn-ghost:hover:not(:disabled) { color: var(--ink); border-color: #cbd5e1; }
    .runbtn, .addbtn { font: inherit; font-size: 13.5px; font-weight: 600; border-radius: 9px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--tg); }
    .runbtn { background: rgba(10,186,181,.08); color: var(--tg-dark); }
    .runbtn:hover:not(:disabled) { background: rgba(10,186,181,.16); }
    .addbtn { background: var(--tg); color: #fff; border-color: var(--tg); }
    .addbtn:hover:not(:disabled) { background: var(--tg-dark); }
    .runbtn:disabled, .addbtn:disabled { opacity: .6; cursor: default; }
    .note { font-size: 12.5px; color: var(--faint); margin-top: 6px; }
    /* forms (edit + add) */
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
    input, textarea, select { width: 100%; font: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
    textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    .form-actions { display: flex; gap: 8px; margin-top: 14px; }
    /* modal */
    .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50; }
    .overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 560px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
    .modal h2 { margin: 0 0 4px; font-size: 18px; }
    .modal .sub { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; z-index: 60; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v14a3 3 0 1 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M9 5a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3"/><path d="M15 5a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3"/></svg>
    </div>
    <div>
      <h1>Luna Brain</h1>
      <p>The gate verifies most facts for you. Only the exceptions land here.</p>
    </div>
    <div class="spacer"></div>
    <button class="addbtn" id="add">Add knowledge</button>
    <button class="runbtn" id="run">Run verification now</button>
    <a class="back" href="https://id.travelify.io">Dashboard</a>
  </header>

  <main>
    <div class="tabs">
      <button class="tab active" data-view="queue">To verify<span class="pill" id="pill-queue"></span></button>
      <button class="tab" data-view="spotcheck">Spot-check<span class="pill" id="pill-spotcheck"></span></button>
      <button class="tab" data-view="gaps">Gaps<span class="pill" id="pill-gaps"></span></button>
    </div>
    <div id="list"></div>
    <div class="state" id="loading">Loading…</div>
  </main>

  <!-- Add knowledge modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>Add knowledge</h2>
      <p class="sub">It lands as a draft and runs through the gate. Nothing goes live until it passes or you verify it.</p>
      <label for="f-client">Business</label>
      <select id="f-client"><option value="">Loading businesses…</option></select>
      <label for="f-type">Type</label>
      <select id="f-type">
        <option>FAQ</option><option>Policy</option><option>Preference</option>
        <option>Supplier Rule</option><option>Destination Note</option><option>Pricing</option>
        <option>Booking Process</option><option selected>Other</option>
      </select>
      <label for="f-question">Question</label>
      <input id="f-question" type="text" maxlength="400" placeholder="What a visitor might ask">
      <label for="f-answer">Answer</label>
      <textarea id="f-answer" maxlength="4000" placeholder="The trusted answer"></textarea>
      <div class="form-actions">
        <button class="act btn-verify" id="f-submit">Add and check</button>
        <button class="act btn-ghost" id="f-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    'use strict';

    var listEl = document.getElementById('list');
    var loadingEl = document.getElementById('loading');
    var toastEl = document.getElementById('toast');
    var runBtn = document.getElementById('run');
    var addBtn = document.getElementById('add');
    var overlay = document.getElementById('overlay');
    var toastTimer = null;
    var currentView = 'queue';
    var clientsLoaded = false;

    var TYPES = ['FAQ', 'Policy', 'Preference', 'Supplier Rule', 'Destination Note', 'Pricing', 'Booking Process', 'Other'];

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3600);
    }
    function fmtDate(iso) {
      if (!iso) return '';
      var d = new Date(iso); if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function setPill(view, n) {
      var el = document.getElementById('pill-' + view);
      if (el) el.textContent = n ? String(n) : '';
    }
    function postJson(url, payload) {
      return fetch(url, {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload || {})
      }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); });
    }

    function emptyHtml(view) {
      if (view === 'spotcheck') {
        return '<div class="state empty"><div class="big">Nothing to spot-check</div>' +
          '<div>High-risk facts the gate auto-published will show here for a quick eyeball.</div></div>';
      }
      if (view === 'gaps') {
        return '<div class="state empty"><div class="big">No open gaps</div>' +
          '<div>When Luna cannot answer a visitor question, it lands here so you can draft an answer.</div></div>';
      }
      return '<div class="state empty"><div class="big">Queue clear</div>' +
        '<div>Every fact is verified and live. Add knowledge or run the gate to bring more in.</div></div>';
    }

    function gapCardHtml(it) {
      var tags = [];
      if (it.occurrences) tags.push('<span class="tag review">Asked ' + it.occurrences + (it.occurrences === 1 ? ' time' : ' times') + '</span>');
      if (it.topic) tags.push('<span class="tag">' + esc(it.topic) + '</span>');
      if (it.clientName) tags.push('<span class="tag">' + esc(it.clientName) + '</span>');
      var meta = it.lastSeenAt ? 'Last asked ' + fmtDate(it.lastSeenAt) : '';
      return '' +
        '<div class="card" data-id="' + esc(it.id) + '" data-suggested="' + esc(it.suggestedAnswer || '') + '">' +
          '<div class="view">' +
            '<p class="q">' + esc(it.question || '(no question)') + '</p>' +
            (it.suggestedAnswer ? '<p class="a">Luna suggests: ' + esc(it.suggestedAnswer) + '</p>' : '<p class="gate">No suggested answer yet — you write it.</p>') +
            '<div class="tags">' + tags.join('') + '</div>' +
            '<div class="actions"><button class="act btn-verify" data-action="draft-gap">Draft an answer</button></div>' +
            (meta ? '<div class="note">' + esc(meta) + '</div>' : '') +
          '</div>' +
        '</div>';
    }

    function typeOptions(sel) {
      return TYPES.map(function (t) { return '<option' + (t === sel ? ' selected' : '') + '>' + t + '</option>'; }).join('');
    }

    function cardHtml(it, view) {
      var tags = [];
      if (view === 'spotcheck') tags.push('<span class="tag spot">High-risk · auto-published</span>');
      if (it.confidence === 'Needs Review' && view !== 'spotcheck') tags.push('<span class="tag review">Needs review</span>');
      if (it.status === 'Draft') tags.push('<span class="tag draft">Draft</span>');
      if (it.type) tags.push('<span class="tag">' + esc(it.type) + '</span>');
      if (it.clientName) tags.push('<span class="tag">' + esc(it.clientName) + '</span>');
      if (it.source) tags.push('<span class="tag">' + esc(it.source) + '</span>');

      var meta = [];
      if (view === 'spotcheck' && it.lastVerifiedAt) meta.push('Published ' + fmtDate(it.lastVerifiedAt));
      else if (it.createdAt) meta.push('Added ' + fmtDate(it.createdAt));
      if (it.timesUsed) meta.push('Used ' + it.timesUsed + (it.timesUsed === 1 ? ' time' : ' times'));

      var actions = (view === 'spotcheck')
        ? '<button class="act btn-verify" data-action="clear_spotcheck">Looks right</button>' +
          '<button class="act btn-ghost" data-action="needs_review">Send back to review</button>' +
          '<button class="act btn-ghost" data-action="archive">Archive</button>'
        : '<button class="act btn-verify" data-action="verify">Verify and publish</button>' +
          '<button class="act btn-ghost" data-action="edit">Edit</button>' +
          '<button class="act btn-ghost" data-action="needs_review">Keep for review</button>' +
          '<button class="act btn-ghost" data-action="archive">Archive</button>';

      return '' +
        '<div class="card" data-id="' + esc(it.id) + '" data-type="' + esc(it.type || 'Other') + '">' +
          '<div class="view">' +
            '<p class="q">' + esc(it.question || '(no question set)') + '</p>' +
            '<p class="a">' + esc(it.answer || '(no answer set)') + '</p>' +
            (it.gateNote ? '<p class="gate">' + esc(it.gateNote) + '</p>' : '') +
            '<div class="tags">' + tags.join('') + '</div>' +
            '<div class="actions">' + actions + '</div>' +
            (meta.length ? '<div class="note">' + esc(meta.join('  ·  ')) + '</div>' : '') +
          '</div>' +
        '</div>';
    }

    function render(view, items) {
      loadingEl.style.display = 'none';
      setPill(view, items.length);
      if (!items.length) { listEl.innerHTML = emptyHtml(view); return; }
      listEl.innerHTML = items.map(function (it) {
        return view === 'gaps' ? gapCardHtml(it) : cardHtml(it, view);
      }).join('');
    }

    function loadView(view) {
      currentView = view;
      loadingEl.style.display = ''; loadingEl.textContent = 'Loading…';
      listEl.innerHTML = '';
      var url = view === 'gaps' ? '/api/brain/gaps' : '/api/brain/queue?view=' + encodeURIComponent(view);
      fetch(url, { credentials: 'include', cache: 'no-store' })
        .then(function (r) {
          if (r.status === 401) { window.location.reload(); return null; }
          if (!r.ok) throw new Error('load_' + r.status);
          return r.json();
        })
        .then(function (data) { if (data && data.ok) render(view, data.items || []); })
        .catch(function (err) { console.error(err); loadingEl.textContent = 'Could not load. Please refresh.'; });
    }

    // ---- edit (inline) ----
    function openEditor(card) {
      var q = card.querySelector('.q').textContent;
      var a = card.querySelector('.a').textContent;
      var type = card.getAttribute('data-type') || 'Other';
      var html =
        '<label>Type</label><select class="e-type">' + typeOptions(type) + '</select>' +
        '<label>Question</label><input class="e-q" type="text" maxlength="400" value="' + esc(q) + '">' +
        '<label>Answer</label><textarea class="e-a" maxlength="4000">' + esc(a) + '</textarea>' +
        '<div class="form-actions">' +
          '<button class="act btn-verify" data-action="save-edit">Save and re-check</button>' +
          '<button class="act btn-ghost" data-action="cancel-edit">Cancel</button>' +
        '</div>';
      var editor = document.createElement('div');
      editor.className = 'editor'; editor.innerHTML = html;
      card.querySelector('.view').style.display = 'none';
      card.appendChild(editor);
    }
    function closeEditor(card) {
      var ed = card.querySelector('.editor'); if (ed) ed.remove();
      var v = card.querySelector('.view'); if (v) v.style.display = '';
    }
    function openGapEditor(card) {
      var suggested = card.getAttribute('data-suggested') || '';
      var html =
        '<label>Type</label><select class="g-type">' + typeOptions('FAQ') + '</select>' +
        '<label>Answer</label><textarea class="g-a" maxlength="4000" placeholder="Write the trusted answer">' + esc(suggested) + '</textarea>' +
        '<div class="form-actions">' +
          '<button class="act btn-verify" data-action="promote-gap">Draft and check</button>' +
          '<button class="act btn-ghost" data-action="cancel-gap">Cancel</button>' +
        '</div>';
      var editor = document.createElement('div'); editor.className = 'editor'; editor.innerHTML = html;
      card.querySelector('.view').style.display = 'none';
      card.appendChild(editor);
    }

    // Item + edit actions
    listEl.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-action]'); if (!btn) return;
      var card = btn.closest('.card'); var id = card && card.getAttribute('data-id'); if (!id) return;
      var action = btn.getAttribute('data-action');

      if (action === 'edit') { openEditor(card); return; }
      if (action === 'cancel-edit' || action === 'cancel-gap') { closeEditor(card); return; }
      if (action === 'draft-gap') { openGapEditor(card); return; }

      if (action === 'promote-gap') {
        var ga = card.querySelector('.g-a').value.trim();
        var gtype = card.querySelector('.g-type').value;
        if (!ga) { toast('Write an answer first.'); return; }
        card.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
        postJson('/api/brain/promote-gap', { gapId: id, answer: ga, type: gtype })
          .then(function (res) {
            if (!res.ok || !res.d.ok) throw new Error();
            var g = res.d.gate;
            toast(g && g.outcome === 'publish' ? 'Drafted and auto-published' : 'Drafted, waiting in the queue for you');
            loadView('gaps');
          })
          .catch(function () {
            card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
            toast('Could not draft that. Please try again.');
          });
        return;
      }

      if (action === 'save-edit') {
        var q = card.querySelector('.e-q').value.trim();
        var a = card.querySelector('.e-a').value.trim();
        var type = card.querySelector('.e-type').value;
        if (!q || !a) { toast('Question and answer are both needed.'); return; }
        card.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
        postJson('/api/brain/edit', { id: id, question: q, answer: a, type: type })
          .then(function (res) {
            if (!res.ok || !res.d.ok) throw new Error();
            var g = res.d.gate;
            toast(g && g.outcome === 'publish' ? 'Saved and auto-published' : 'Saved, kept for review');
            loadView(currentView);
          })
          .catch(function () {
            card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
            toast('Could not save the edit.');
          });
        return;
      }

      // verify / archive / needs_review / clear_spotcheck
      card.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      postJson('/api/brain/verify', { id: id, action: action })
        .then(function (res) {
          if (!res.ok || !res.d.ok) throw new Error((res.d && res.d.error) || 'failed');
          card.style.transition = 'opacity .18s'; card.style.opacity = '0';
          setTimeout(function () {
            card.remove();
            var remaining = listEl.querySelectorAll('.card').length;
            setPill(currentView, remaining);
            if (!remaining) listEl.innerHTML = emptyHtml(currentView);
          }, 180);
          toast({ verify: 'Verified and published', archive: 'Archived', needs_review: 'Kept for review', clear_spotcheck: 'Spot-check cleared' }[action] || 'Done');
        })
        .catch(function (err) {
          console.error(err);
          card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
          toast('That did not save. Please try again.');
        });
    });

    // Tabs
    document.querySelector('.tabs').addEventListener('click', function (e) {
      var tab = e.target.closest('.tab'); if (!tab) return;
      document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      loadView(tab.getAttribute('data-view'));
    });

    // Run the gate
    runBtn.addEventListener('click', function () {
      runBtn.disabled = true; runBtn.textContent = 'Verifying…';
      postJson('/api/brain/run-gate', {})
        .then(function (res) {
          if (!res.ok || !res.d.ok) throw new Error((res.d && res.d.error) || 'failed');
          var s = res.d;
          if (!s.processed) toast('Nothing new to check.');
          else toast(s.published + ' auto-published (' + s.spotCheck + ' to spot-check), ' + s.escalated + ' kept for you.');
          loadView(currentView);
        })
        .catch(function () { toast('The gate could not finish. Please try again.'); })
        .finally(function () { runBtn.disabled = false; runBtn.textContent = 'Run verification now'; });
    });

    // ---- add knowledge modal ----
    function loadClients() {
      if (clientsLoaded) return;
      fetch('/api/brain/clients', { credentials: 'include', cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          var sel = document.getElementById('f-client');
          if (!data || !data.ok) { sel.innerHTML = '<option value="">Could not load businesses</option>'; return; }
          sel.innerHTML = '<option value="">Choose a business…</option>' +
            data.clients.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join('');
          clientsLoaded = true;
        })
        .catch(function () {});
    }
    function openModal() { overlay.classList.add('show'); loadClients(); }
    function closeModal() { overlay.classList.remove('show'); }

    addBtn.addEventListener('click', openModal);
    document.getElementById('f-cancel').addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });

    document.getElementById('f-submit').addEventListener('click', function () {
      var clientId = document.getElementById('f-client').value;
      var question = document.getElementById('f-question').value.trim();
      var answer = document.getElementById('f-answer').value.trim();
      var type = document.getElementById('f-type').value;
      if (!clientId) { toast('Pick a business first.'); return; }
      if (!question || !answer) { toast('Question and answer are both needed.'); return; }
      var submit = document.getElementById('f-submit');
      submit.disabled = true; submit.textContent = 'Adding…';
      postJson('/api/brain/ingest', { clientId: clientId, question: question, answer: answer, type: type })
        .then(function (res) {
          if (!res.ok || !res.d.ok) throw new Error((res.d && res.d.error) || 'failed');
          if (res.d.duplicate) { toast('A very similar item already exists — edit that one instead.'); return; }
          var g = res.d.gate;
          toast(g && g.outcome === 'publish' ? 'Added and auto-published' : 'Added, waiting in the queue for you');
          document.getElementById('f-question').value = '';
          document.getElementById('f-answer').value = '';
          closeModal();
          loadView('queue');
          document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-view') === 'queue'); });
        })
        .catch(function () { toast('Could not add that. Please try again.'); })
        .finally(function () { submit.disabled = false; submit.textContent = 'Add and check'; });
    });

    window.addEventListener('tg-auth-ready', function () { loadView('queue'); });
  </script>
</body>
</html>
