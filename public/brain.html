<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna Brain — Verify knowledge</title>
  <!-- SSO + product gate. Only users with Luna Brain access (or staff) get in. -->
  <script src="https://id.travelify.io/tg-auth-gate.js" data-product="luna_brain"></script>
  <style>
    :root {
      --tg: #0ABAB5; --tg-dark: #089693;
      --ink: #0f172a; --muted: #475569; --faint: #94a3b8;
      --line: #e2e8f0; --bg: #f8fafc; --card: #fff;
      --amber: #b45309; --amber-bg: #fffbeb; --green: #047857;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 18px 24px; display: flex; align-items: center; gap: 14px; }
    header .mark { width: 34px; height: 34px; border-radius: 9px; background: rgba(10,186,181,.12); color: var(--tg); display: grid; place-items: center; }
    header h1 { font-size: 17px; margin: 0; font-weight: 700; }
    header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    header .spacer { flex: 1; }
    header a.back { font-size: 13px; color: var(--muted); text-decoration: none; }
    header a.back:hover { color: var(--ink); }
    main { max-width: 860px; margin: 0 auto; padding: 24px; }
    .bar { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
    .bar h2 { font-size: 15px; margin: 0; font-weight: 600; }
    .bar .count { font-size: 13px; color: var(--faint); }
    .state { text-align: center; padding: 64px 24px; color: var(--muted); }
    .state.empty .big { font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
    .card .q { font-size: 15px; font-weight: 650; margin: 0 0 8px; }
    .card .a { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0 0 12px; white-space: pre-wrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tag { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: #f1f5f9; color: var(--muted); font-weight: 600; }
    .tag.review { background: var(--amber-bg); color: var(--amber); }
    .tag.draft { background: #eff6ff; color: #1d4ed8; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { font: inherit; font-size: 13.5px; font-weight: 600; border-radius: 9px; padding: 8px 14px; cursor: pointer; border: 1px solid transparent; }
    button:disabled { opacity: .5; cursor: default; }
    .btn-verify { background: var(--tg); color: #fff; }
    .btn-verify:hover:not(:disabled) { background: var(--tg-dark); }
    .btn-ghost { background: #fff; color: var(--muted); border-color: var(--line); }
    .btn-ghost:hover:not(:disabled) { color: var(--ink); border-color: #cbd5e1; }
    .note { font-size: 12.5px; color: var(--faint); margin-top: 6px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v14a3 3 0 1 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M9 5a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3"/><path d="M15 5a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3"/></svg>
    </div>
    <div>
      <h1>Luna Brain</h1>
      <p>Verify knowledge before it goes live</p>
    </div>
    <div class="spacer"></div>
    <a class="back" href="https://id.travelify.io">Back to dashboard</a>
  </header>

  <main>
    <div class="bar">
      <h2>Waiting to verify</h2>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
    <div class="state" id="loading">Loading the queue…</div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    'use strict';

    var listEl = document.getElementById('list');
    var loadingEl = document.getElementById('loading');
    var countEl = document.getElementById('count');
    var toastEl = document.getElementById('toast');
    var toastTimer = null;

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
    }

    function fmtDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderCount(n) {
      countEl.textContent = n === 0 ? '' : (n === 1 ? '1 item' : n + ' items');
    }

    function showEmpty() {
      listEl.innerHTML =
        '<div class="state empty"><div class="big">Nothing waiting</div>' +
        '<div>Every fact is verified and live. New items will appear here for a quick check.</div></div>';
    }

    function cardHtml(it) {
      var tags = [];
      if (it.confidence === 'Needs Review') tags.push('<span class="tag review">Needs review</span>');
      if (it.status === 'Draft') tags.push('<span class="tag draft">Draft</span>');
      if (it.type) tags.push('<span class="tag">' + esc(it.type) + '</span>');
      if (it.clientName) tags.push('<span class="tag">' + esc(it.clientName) + '</span>');
      if (it.source) tags.push('<span class="tag">' + esc(it.source) + '</span>');

      var meta = [];
      if (it.createdAt) meta.push('Added ' + fmtDate(it.createdAt));
      if (it.timesUsed) meta.push('Used ' + it.timesUsed + (it.timesUsed === 1 ? ' time' : ' times'));

      return '' +
        '<div class="card" data-id="' + esc(it.id) + '">' +
          '<p class="q">' + esc(it.question || '(no question set)') + '</p>' +
          '<p class="a">' + esc(it.answer || '(no answer set)') + '</p>' +
          '<div class="tags">' + tags.join('') + '</div>' +
          '<div class="actions">' +
            '<button class="btn-verify" data-action="verify">Verify and publish</button>' +
            '<button class="btn-ghost" data-action="needs_review">Keep for review</button>' +
            '<button class="btn-ghost" data-action="archive">Archive</button>' +
          '</div>' +
          (meta.length ? '<div class="note">' + esc(meta.join('  ·  ')) + '</div>' : '') +
        '</div>';
    }

    function render(items) {
      loadingEl.style.display = 'none';
      renderCount(items.length);
      if (!items.length) { showEmpty(); return; }
      listEl.innerHTML = items.map(cardHtml).join('');
    }

    function loadQueue() {
      fetch('/api/brain/queue', { credentials: 'include', cache: 'no-store' })
        .then(function (r) {
          if (r.status === 401) { window.location.reload(); return null; }
          if (!r.ok) throw new Error('queue_' + r.status);
          return r.json();
        })
        .then(function (data) { if (data && data.ok) render(data.items || []); })
        .catch(function (err) {
          console.error(err);
          loadingEl.textContent = 'Could not load the queue. Please refresh.';
        });
    }

    // Action buttons (event delegation).
    listEl.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var card = btn.closest('.card');
      var id = card && card.getAttribute('data-id');
      if (!id) return;
      var action = btn.getAttribute('data-action');

      var buttons = card.querySelectorAll('button');
      buttons.forEach(function (b) { b.disabled = true; });

      fetch('/api/brain/verify', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, action: action })
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok || !res.d.ok) throw new Error((res.d && res.d.error) || 'failed');
          // Item handled — drop it from the queue and update the count.
          card.style.transition = 'opacity .18s'; card.style.opacity = '0';
          setTimeout(function () {
            card.remove();
            var remaining = listEl.querySelectorAll('.card').length;
            renderCount(remaining);
            if (!remaining) showEmpty();
          }, 180);
          toast(action === 'verify' ? 'Verified and published' : action === 'archive' ? 'Archived' : 'Kept for review');
        })
        .catch(function (err) {
          console.error(err);
          buttons.forEach(function (b) { b.disabled = false; });
          toast('That did not save. Please try again.');
        });
    });

    // Wait for the auth gate before fetching anything.
    window.addEventListener('tg-auth-ready', loadQueue);
  </script>
</body>
</html>
