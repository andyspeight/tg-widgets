<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Choose your departure airport</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --text: #1a2733; --muted: #5b6b7b;
    --line: #dde4ea; --accent: #00B4D8; --accent-ink: #036e86; --hover: #eef6f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1520; --card: #16202c; --text: #e8eef4; --muted: #93a4b5;
      --line: #263442; --accent: #00B4D8; --accent-ink: #7fd9ec; --hover: #1c2a38;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 40px;
  }
  ::selection { background: var(--accent); color: #fff; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    width: 100%; max-width: 560px; padding: 28px; box-shadow: 0 8px 30px rgba(10, 30, 50, .06);
  }
  h1 { font-size: 22px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin-top: 6px; font-size: 14px; }
  .event { margin-top: 14px; padding: 10px 14px; border-left: 3px solid var(--accent);
    background: var(--hover); border-radius: 0 8px 8px 0; font-size: 14px; }
  .search { margin-top: 18px; position: relative; }
  .search input {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--text);
    background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 180, 216, .18); }
  .list { margin-top: 10px; max-height: 46vh; overflow-y: auto; border: 1px solid var(--line);
    border-radius: 10px; }
  .list:empty { display: none; }
  .apt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 11px 14px; font: inherit; color: var(--text); background: none;
    border: 0; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .apt:last-child { border-bottom: 0; }
  .apt:hover, .apt:focus-visible { background: var(--hover); outline: none; }
  .apt:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .apt .code {
    font-weight: 700; font-size: 13px; letter-spacing: .04em; color: var(--accent-ink);
    background: var(--hover); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 7px; min-width: 46px; text-align: center;
  }
  .apt .cc { margin-left: auto; color: var(--muted); font-size: 12px; }
  .last { font-size: 12px; color: var(--muted); margin: 14px 0 0; }
  .last button {
    font: inherit; color: var(--accent-ink); background: none; border: 0; padding: 0;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  .state { margin-top: 18px; color: var(--muted); font-size: 14px; }
  .err { color: #b3423a; }
  @media (prefers-color-scheme: dark) { .err { color: #ff9e96; } }
</style>
</head>
<body>
<main class="card">
  <h1>Where are you flying from?</h1>
  <p class="sub">Pick your departure airport and we will put the flights, a place to stay and your tickets together.</p>
  <div class="event" id="event" hidden></div>
  <div class="search"><input id="q" type="search" placeholder="Search airports by name or code" aria-label="Search airports" autocomplete="off"></div>
  <div class="list" id="list" role="listbox" aria-label="Airports"></div>
  <p class="last" id="last" hidden></p>
  <p class="state" id="state">Loading airports&hellip;</p>
</main>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var IATA = /^[A-Z]{3}$/;
  var PLACEHOLDER = '__ORG__';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  // The template must be OUR booking host with the org placeholder, nothing
  // else: this page must never become an open redirect.
  function readTemplate() {
    var raw = new URLSearchParams(location.search).get('d') || '';
    var u;
    try { u = new URL(raw); } catch (e) { return null; }
    if (u.protocol !== 'https:' || u.hostname !== 'dl.tvllnk.com') return null;
    if (u.pathname.indexOf('/deeplink/') !== 0) return null;
    return u;
  }

  var tpl = readTemplate();
  if (!tpl) {
    $('q').parentNode.hidden = true;
    $('state').className = 'state err';
    $('state').textContent = 'This booking link is incomplete. Please go back and press the booking button again.';
    return;
  }

  // Already carries a real airport? Straight through.
  if (IATA.test(tpl.searchParams.get('org') || '')) { location.replace(tpl.toString()); return; }

  var loc = tpl.searchParams.get('loc');
  if (loc) { $('event').hidden = false; $('event').textContent = loc; }

  function go(iata) {
    if (!IATA.test(iata)) return;
    try { localStorage.setItem('tgfly_org', JSON.stringify(iata)); } catch (e) { /* private mode */ }
    var out = readTemplate();
    out.searchParams.set('org', iata);
    // Belt and braces: the placeholder must actually have been replaced.
    if (out.toString().indexOf(PLACEHOLDER) !== -1) return;
    location.href = out.toString();
  }

  var AIRPORTS = [];

  function rows(filter) {
    var f = String(filter || '').trim().toLowerCase();
    var out = [];
    for (var i = 0; i < AIRPORTS.length; i++) {
      var a = AIRPORTS[i];
      if (!f || a[0].toLowerCase().indexOf(f) === 0 || a[1].toLowerCase().indexOf(f) !== -1) out.push(a);
      if (out.length >= 12) break;
    }
    return out;
  }

  function draw() {
    var list = $('list');
    var html = '';
    var shown = rows($('q').value);
    for (var i = 0; i < shown.length; i++) {
      var a = shown[i];
      html += '<button class="apt" type="button" role="option" data-iata="' + esc(a[0]) + '">'
        + '<span class="code">' + esc(a[0]) + '</span><span>' + esc(a[1]) + '</span>'
        + '<span class="cc">' + esc(a[2]) + '</span></button>';
    }
    list.innerHTML = html;
    $('state').textContent = shown.length ? '' : 'No airport matches that. Try the three-letter code.';
  }

  $('list').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.apt') : null;
    if (btn) go(btn.getAttribute('data-iata'));
  });
  $('q').addEventListener('input', draw);
  $('q').addEventListener('keydown', function (e) {
    // Enter takes the top match, or a typed code directly.
    if (e.key !== 'Enter') return;
    var typed = $('q').value.trim().toUpperCase();
    if (IATA.test(typed) && AIRPORTS.some(function (a) { return a[0] === typed; })) { go(typed); return; }
    var top = rows($('q').value)[0];
    if (top) go(top[0]);
  });

  fetch('/api/events-feed?view=airports', { credentials: 'omit' })
    .then(function (r) { if (!r.ok) throw new Error('failed'); return r.json(); })
    .then(function (d) {
      AIRPORTS = Array.isArray(d.airports) ? d.airports.filter(function (a) {
        return Array.isArray(a) && IATA.test(String(a[0] || ''));
      }) : [];
      if (!AIRPORTS.length) throw new Error('empty');
      var remembered = null;
      try { remembered = JSON.parse(localStorage.getItem('tgfly_org')); } catch (e) { /* fine */ }
      if (IATA.test(remembered || '') && AIRPORTS.some(function (a) { return a[0] === remembered; })) {
        var el = $('last');
        el.hidden = false;
        el.innerHTML = 'Last time you flew from <button type="button" id="last-btn">'
          + esc(remembered) + '</button>.';
        document.getElementById('last-btn').addEventListener('click', function () { go(remembered); });
      }
      $('state').textContent = '';
      draw();
      $('q').focus();
    })
    .catch(function () {
      $('state').className = 'state err';
      $('state').textContent = 'The airport list did not load. Please try again in a moment.';
    });
})();
</script>
</body>
</html>
