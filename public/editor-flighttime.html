<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Time &amp; Distance — Travelgenix Widget Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/editor-shell.css">
<style>
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { display:block; font-size:12px; font-weight:600; color:var(--tgse-ink-2); margin-bottom:6px; letter-spacing:.02em; }
  .field-hint { display:block; font-size:11px; color:var(--tgse-ink-3); margin-top:4px; line-height:1.45; }
  .input, .select { width:100%; padding:8px 10px; font:inherit; font-size:13px; border:1px solid var(--tgse-border); border-radius:var(--tgse-radius-sm); background:var(--tgse-panel); color:var(--tgse-ink); transition:border-color 160ms ease, box-shadow 160ms ease; }
  .input:focus, .select:focus { outline:none; border-color:var(--tgse-brand); box-shadow:0 0 0 3px var(--tgse-brand-tint); }

  .pick-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pick-btn { appearance:none; border:1.5px solid var(--tgse-border); background:var(--tgse-panel); padding:10px 6px; border-radius:var(--tgse-radius-sm); cursor:pointer; text-align:center; transition:border-color 160ms ease, background 160ms ease; }
  .pick-btn:hover { background:var(--tgse-hover); }
  .pick-btn.is-on { border-color:var(--tgse-brand); background:var(--tgse-brand-tint); }
  .pick-label { font-size:12px; font-weight:600; color:var(--tgse-ink); }
  .pick-btn.is-on .pick-label { color:var(--tgse-brand-dark); }

  .colour-row { display:flex; align-items:center; gap:8px; }
  .colour-swatch-wrap { position:relative; width:36px; height:36px; border-radius:var(--tgse-radius-sm); border:1px solid var(--tgse-border); overflow:hidden; flex-shrink:0; }
  .colour-swatch-wrap input[type="color"] { position:absolute; inset:-2px; width:calc(100% + 4px); height:calc(100% + 4px); border:0; padding:0; background:transparent; cursor:pointer; }
  .colour-hex { flex:1; font-family:'JetBrains Mono', monospace; text-transform:uppercase; }

  .switch-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; }
  .switch-row-label { font-size:13px; color:var(--tgse-ink); font-weight:500; }
  .switch { appearance:none; width:36px; height:20px; border-radius:999px; background:var(--tgse-border); border:0; padding:0; cursor:pointer; position:relative; transition:background 160ms ease; flex-shrink:0; }
  .switch::after { content:""; position:absolute; width:16px; height:16px; border-radius:999px; background:#fff; top:2px; left:2px; box-shadow:0 1px 2px rgba(0,0,0,.15); transition:transform 160ms ease; }
  .switch.is-on { background:var(--tgse-brand); }
  .switch.is-on::after { transform:translateX(16px); }
</style>
</head>
<body>
<div class="tgse-app">
  <aside class="tgse-sidebar">

    <div class="tgse-crumb">
      <a href="/" id="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back to dashboard
      </a>
    </div>

    <div class="tgse-id">
      <span class="tgse-id-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.12 2.12 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.8l3.9 4.3-2.2 2.2-1.6-.4a.5.5 0 0 0-.5.8L6 18l1.7 2.6a.5.5 0 0 0 .8-.1l2.2-1.6 4.3 3.9a.5.5 0 0 0 .8-.5z"/></svg>
      </span>
      <div class="tgse-id-meta">
        <div class="tgse-id-name">Flight Time &amp; Distance</div>
        <div class="tgse-id-type">Widget editor</div>
      </div>
    </div>

    <div class="tgse-actions">
      <button class="tgse-btn" id="btn-templates" title="Templates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Templates <span class="tgse-kbd">T</span>
      </button>
      <button class="tgse-btn tgse-btn--ai" id="btn-ai" title="AI builder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.7L18.6 9.6l-4.7 1.9L12 16.2 10.1 11.5 5.4 9.6 10.1 7.7z"/><path d="M5 16l.8 2.2 2.2.8-2.2.8L5 22l-.8-2.2L2 19l2.2-.8z"/></svg>
        AI builder <span class="tgse-kbd">A</span>
      </button>
    </div>

    <div class="tgse-name">
      <input type="text" id="name-input" placeholder="Untitled flight time" maxlength="80">
      <button class="tgse-btn tgse-btn--primary" id="btn-save" title="Save (⌘S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span id="save-label">Save</span>
      </button>
    </div>

    <nav class="tgse-tabs" role="tablist">
      <button data-tab="content" role="tab" aria-selected="true">Content</button>
      <button data-tab="design" role="tab" aria-selected="false">Design</button>
      <button data-tab="settings" role="tab" aria-selected="false">Settings</button>
    </nav>

    <div class="tgse-body" id="sb-body">

      <!-- CONTENT -->
      <div class="tgse-panel is-active" data-tab="content">
        <div class="tgse-section is-open">
          <div class="tgse-section-head">
            <svg class="tgse-section-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            <span class="tgse-section-label">Heading</span>
            <svg class="tgse-section-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="tgse-section-body">
            <div class="field">
              <label class="field-label">Title</label>
              <input type="text" class="input" id="heading-input" maxlength="60" placeholder="Flight time & distance">
            </div>
          </div>
        </div>

        <div class="tgse-section is-open">
          <div class="tgse-section-head">
            <svg class="tgse-section-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.12 2.12 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.8l3.9 4.3-2.2 2.2-1.6-.4a.5.5 0 0 0-.5.8L6 18l1.7 2.6a.5.5 0 0 0 .8-.1l2.2-1.6 4.3 3.9a.5.5 0 0 0 .8-.5z"/></svg>
            <span class="tgse-section-label">Default route</span>
            <svg class="tgse-section-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="tgse-section-body">
            <div class="field">
              <label class="field-label">From</label>
              <select class="select" id="from-select"></select>
            </div>
            <div class="field">
              <label class="field-label">To</label>
              <select class="select" id="to-select"></select>
            </div>
            <span class="field-hint">Visitors can change these. This is just the starting pair.</span>
          </div>
        </div>
      </div>

      <!-- DESIGN -->
      <div class="tgse-panel" data-tab="design">
        <div class="tgse-section is-open">
          <div class="tgse-section-head">
            <svg class="tgse-section-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            <span class="tgse-section-label">Layout</span>
            <svg class="tgse-section-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="tgse-section-body">
            <div class="field">
              <div class="pick-grid" id="layout-picker">
                <button type="button" class="pick-btn" data-layout="card"><span class="pick-label">Card</span></button>
                <button type="button" class="pick-btn" data-layout="inline"><span class="pick-label">Plain</span></button>
              </div>
            </div>
          </div>
        </div>

        <div class="tgse-section is-open">
          <div class="tgse-section-head">
            <svg class="tgse-section-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/></svg>
            <span class="tgse-section-label">Accent colour</span>
            <svg class="tgse-section-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="tgse-section-body">
            <div class="field">
              <div class="colour-row">
                <div class="colour-swatch-wrap"><input type="color" id="accent-col" value="#0891B2"></div>
                <input class="input colour-hex" id="accent-hex" value="#0891B2" maxlength="9">
              </div>
            </div>
          </div>
        </div>

        <div class="tgse-section">
          <div class="tgse-section-head">
            <svg class="tgse-section-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            <span class="tgse-section-label">Typography</span>
            <svg class="tgse-section-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="tgse-section-body">
            <div class="field">
              <label class="field-label">Font</label>
              <div id="fontPickerMount"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- SETTINGS -->
      <div class="tgse-panel" data-tab="settings">
        <div class="tgse-section is-open">
          <div class="tgse-section-head">
            <svg class="tgse-section-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M2 12h20"/></svg>
            <span class="tgse-section-label">Display</span>
            <svg class="tgse-section-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="tgse-section-body">
            <div class="field">
              <label class="field-label">Distance units</label>
              <select class="select" id="units-select">
                <option value="both">Kilometres &amp; miles</option>
                <option value="km">Kilometres only</option>
                <option value="mi">Miles only</option>
              </select>
            </div>
            <div class="field">
              <div class="switch-row"><span class="switch-row-label">Show flight time</span><button type="button" class="switch is-on" id="sw-time" aria-pressed="true"></button></div>
              <div class="switch-row"><span class="switch-row-label">Country flags</span><button type="button" class="switch is-on" id="sw-flags" aria-pressed="true"></button></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </aside>

  <section class="tgse-preview">
    <div class="tgse-toolbar">
      <span class="tgse-status"><span class="tgse-status-dot"></span> Live preview</span>
      <span class="tgse-spacer"></span>
      <div class="tgse-vp" role="group" aria-label="Viewport">
        <button class="is-on" data-vp="desktop" title="Desktop" aria-label="Desktop view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
        <button data-vp="tablet" title="Tablet" aria-label="Tablet view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M12 18h.01"/></svg></button>
        <button data-vp="mobile" title="Mobile" aria-label="Mobile view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 18h.01"/></svg></button>
      </div>
      <div class="tgse-divider"></div>
      <button class="tgse-btn tgse-btn--sm tgse-btn--ghost" id="btn-theme" title="Toggle preview backdrop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Theme</button>
      <button class="tgse-btn tgse-btn--sm tgse-btn--primary" id="btn-embed" title="Get embed code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Get embed code</button>
    </div>
    <div class="tgse-canvas">
      <div class="tgse-frame" data-vp="desktop" id="pv-frame"></div>
    </div>
  </section>
</div>

<script src="/editor-shell.js"></script>
<script src="/widget-flighttime.js"></script>
<style>
  .pv-faux { width:100%; max-width:620px; background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(15,23,42,.08), 0 8px 32px rgba(15,23,42,.05); padding:40px; display:flex; justify-content:center; }
  .pv-faux[data-bg="dark"] { background:#0B1220; }
  #widget-mount { width:100%; }
</style>
<script>
  function hexOk(v) { return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(v || '').trim()); }
  function flagFor(cc){ var c=String(cc||'').slice(0,2).toUpperCase(); if(!/^[A-Z]{2}$/.test(c)) return ''; return String.fromCodePoint.apply(String,[].map.call(c,function(ch){return 0x1F1E6+ch.charCodeAt(0)-65;})); }
  function airports() { return (window.TGFlightTimeWidget && window.TGFlightTimeWidget.AIRPORTS) || {}; }

  let C = {
    heading: 'Flight time & distance',
    defaultFrom: 'LHR', defaultTo: 'JFK',
    units: 'both', accent: '#0891B2', layout: 'card',
    showFlags: true, showTime: true, theme: 'light', fontFamily: 'Inter',
  };

  let widgetInst = null;

  const shell = tgse.init({
    widgetType: 'Flight Time',
    widgetTag: 'flighttime',
    scriptFile: 'widget-flighttime.js',
    getConfig: () => C,
    setConfig: (c) => { C = Object.assign({}, C, c); syncUIFromState(); render(); },
    fontPickerEl: '#fontPickerMount',
    onFontChange: (f) => { C.fontFamily = f; shell.markDirty(); render(); },
    onAIBuild: () => tgse.toast('AI builder coming soon for Flight Time', 'ok'),
    onTemplates: () => tgse.toast('Templates coming soon for Flight Time', 'ok'),
    onThemeToggle: (isDark) => { C.theme = isDark ? 'dark' : 'light'; render(); },
    onDesignMode: () => {},
    onLoginSuccess: () => { loadFromUrl(); },
  });

  function airportOptions(selected) {
    const A = airports();
    return Object.keys(A)
      .sort((a, b) => A[a][0].localeCompare(A[b][0]))
      .map(code => '<option value="' + code + '"' + (code === selected ? ' selected' : '') + '>' + flagFor(A[code][1]) + ' ' + A[code][0] + ' (' + code + ')</option>')
      .join('');
  }

  function buildFauxPage() {
    return '<div class="pv-faux" data-bg="' + (C.theme === 'dark' ? 'dark' : 'light') + '"><div data-tg-widget="flighttime" id="widget-mount"></div></div>';
  }

  function render() {
    const frame = document.getElementById('pv-frame');
    if (!frame) return;
    if (widgetInst) { try { widgetInst.destroy(); } catch (e) {} widgetInst = null; }
    frame.innerHTML = buildFauxPage();
    const host = document.getElementById('widget-mount');
    if (!host) return;
    requestAnimationFrame(() => {
      if (window.TGFlightTimeWidget) {
        try { widgetInst = new window.TGFlightTimeWidget(host, Object.assign({}, C, { previewMode: true })); }
        catch (e) { console.error(e); }
      }
    });
  }

  function toggleSwitch(id, on) { const el = document.getElementById(id); if (!el) return; el.classList.toggle('is-on', !!on); el.setAttribute('aria-pressed', on ? 'true' : 'false'); }

  function syncUIFromState() {
    document.getElementById('heading-input').value = C.heading || '';
    document.getElementById('from-select').innerHTML = airportOptions(C.defaultFrom);
    document.getElementById('to-select').innerHTML = airportOptions(C.defaultTo);
    document.getElementById('units-select').value = C.units;
    document.getElementById('accent-col').value = hexOk(C.accent) ? C.accent : '#0891B2';
    document.getElementById('accent-hex').value = (C.accent || '#0891B2').toUpperCase();
    document.querySelectorAll('#layout-picker [data-layout]').forEach(b => b.classList.toggle('is-on', b.getAttribute('data-layout') === C.layout));
    toggleSwitch('sw-time', C.showTime);
    toggleSwitch('sw-flags', C.showFlags);
  }

  // Wiring
  document.getElementById('heading-input').addEventListener('input', e => { C.heading = e.target.value; shell.markDirty(); render(); });
  document.getElementById('from-select').addEventListener('change', e => { C.defaultFrom = e.target.value; shell.markDirty(); render(); });
  document.getElementById('to-select').addEventListener('change', e => { C.defaultTo = e.target.value; shell.markDirty(); render(); });
  document.getElementById('units-select').addEventListener('change', e => { C.units = e.target.value; shell.markDirty(); render(); });

  document.getElementById('layout-picker').addEventListener('click', e => {
    const b = e.target.closest('[data-layout]'); if (!b) return;
    C.layout = b.getAttribute('data-layout');
    document.querySelectorAll('#layout-picker [data-layout]').forEach(x => x.classList.toggle('is-on', x === b));
    shell.markDirty(); render();
  });

  (function wireColour() {
    const col = document.getElementById('accent-col'), hex = document.getElementById('accent-hex');
    col.addEventListener('input', () => { const v = col.value.toUpperCase(); hex.value = v; C.accent = v; shell.markDirty(); render(); });
    hex.addEventListener('input', () => { const v = (hex.value || '').trim().toUpperCase(); if (hexOk(v)) { col.value = v; C.accent = v; shell.markDirty(); render(); } });
  })();

  function wireSwitch(id, key) { const el = document.getElementById(id); el.addEventListener('click', () => { C[key] = !C[key]; toggleSwitch(id, C[key]); shell.markDirty(); render(); }); }
  wireSwitch('sw-time', 'showTime');
  wireSwitch('sw-flags', 'showFlags');

  document.getElementById('name-input').addEventListener('input', () => shell.markDirty());

  function loadFromUrl() {
    const wId = new URLSearchParams(location.search).get('id');
    if (!wId) { render(); return; }
    fetch('/api/widget-config?id=' + encodeURIComponent(wId))
      .then(r => r.ok ? r.json() : Promise.reject(new Error('config ' + r.status)))
      .then(d => {
        if (d && d.config) C = Object.assign({}, C, d.config);
        if (d && d.name) document.getElementById('name-input').value = d.name;
        syncUIFromState(); render();
      })
      .catch(() => { render(); tgse.toast('Failed to load widget', 'err'); });
  }

  document.addEventListener('DOMContentLoaded', () => {
    syncUIFromState();
    if (window.tgse && typeof window.tgse.onReady === 'function') {
      window.tgse.onReady(() => { if (tgse.isLoggedIn()) loadFromUrl(); else render(); });
    } else { if (tgse.isLoggedIn()) loadFromUrl(); else render(); }
  });
</script>
</body>
</html>
