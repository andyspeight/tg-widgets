<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo Finder — Travelgenix Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --tg-primary: #1B2B5B; --tg-accent: #00B4D8; --tg-success: #10B981; --tg-warning: #F59E0B; --tg-error: #EF4444;
      --tg-bg-primary: #FFFFFF; --tg-bg-secondary: #F8FAFC; --tg-bg-tertiary: #F1F5F9;
      --tg-border: #E2E8F0; --tg-text-primary: #0F172A; --tg-text-secondary: #475569; --tg-text-tertiary: #94A3B8;
      --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --radius: 10px; --radius-sm: 6px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --tg-bg-primary: #0F172A; --tg-bg-secondary: #0B1120; --tg-bg-tertiary: #1E293B;
      --tg-border: #334155; --tg-text-primary: #F8FAFC; --tg-text-secondary: #CBD5E1; --tg-text-tertiary: #64748B; --tg-primary: #48CAE4;
    } }
    :root[data-theme="dark"] {
      --tg-bg-primary: #0F172A; --tg-bg-secondary: #0B1120; --tg-bg-tertiary: #1E293B;
      --tg-border: #334155; --tg-text-primary: #F8FAFC; --tg-text-secondary: #CBD5E1; --tg-text-tertiary: #64748B; --tg-primary: #48CAE4;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.55; color: var(--tg-text-primary); background: var(--tg-bg-secondary); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    .topbar { background: var(--tg-bg-primary); border-bottom: 1px solid var(--tg-border); padding: 0 var(--sp-6); height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
    .brand { display: flex; align-items: center; gap: var(--sp-3); font-weight: 700; }
    .brand .mark { width: 28px; height: 28px; border-radius: var(--radius-sm); color: #fff; background: linear-gradient(135deg, #1B2B5B, #00B4D8); display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .brand .sub { font-weight: 500; color: var(--tg-text-tertiary); font-size: 13px; }
    .top-actions { display: flex; align-items: center; gap: var(--sp-3); }
    .btn { height: 34px; padding: 0 var(--sp-4); border-radius: var(--radius-sm); border: 1px solid var(--tg-border); background: var(--tg-bg-primary); color: var(--tg-text-secondary); cursor: pointer; font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: var(--tg-bg-tertiary); color: var(--tg-text-primary); }
    .btn.primary { background: var(--tg-primary); color: #fff; border-color: transparent; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: var(--sp-6); }
    .card { background: var(--tg-bg-primary); border: 1px solid var(--tg-border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: var(--sp-5); margin-bottom: var(--sp-5); }
    h2 { font-size: 15px; margin: 0 0 var(--sp-3); }
    p.muted { color: var(--tg-text-tertiary); font-size: 13px; margin: 0 0 var(--sp-4); }
    textarea { width: 100%; min-height: 120px; resize: vertical; font: inherit; font-size: 13px; padding: 10px 12px; border: 1px solid var(--tg-border); border-radius: var(--radius-sm); background: var(--tg-bg-primary); color: var(--tg-text-primary); }
    .row { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; margin-top: var(--sp-3); }
    .status { color: var(--tg-text-tertiary); font-size: 12px; }
    .banner { border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; margin-bottom: var(--sp-4); }
    .banner.warn { background: rgba(245,158,11,.12); color: var(--tg-warning); }
    .banner.err { background: rgba(239,68,68,.12); color: var(--tg-error); }
    .banner.ok { background: rgba(16,185,129,.12); color: var(--tg-success); }
    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--sp-4); }
    .lc { border: 1px solid var(--tg-border); border-radius: var(--radius); overflow: hidden; background: var(--tg-bg-primary); display: flex; flex-direction: column; }
    .lc.off { opacity: .5; }
    .lc.miss { border-style: dashed; }
    .lc-preview { height: 120px; display: flex; align-items: center; justify-content: center; background: repeating-conic-gradient(#e2e8f0 0% 25%, #f8fafc 0% 50%) 50% / 16px 16px; padding: 10px; }
    .lc-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .lc-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .lc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .lc-q { font-size: 12px; color: var(--tg-text-tertiary); }
    .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 600; }
    .pill.brandfetch { background: rgba(0,180,216,.14); color: var(--tg-accent); }
    .pill.logodev { background: rgba(99,102,241,.14); color: #6366F1; }
    .pill.svg { background: rgba(16,185,129,.14); color: var(--tg-success); }
    .lc input[type=text] { width: 100%; font: inherit; font-size: 12.5px; padding: 5px 7px; border: 1px solid var(--tg-border); border-radius: 5px; background: var(--tg-bg-primary); color: var(--tg-text-primary); }
    .lc-alts { display: flex; gap: 5px; flex-wrap: wrap; }
    .lc-alt { width: 34px; height: 30px; border: 1px solid var(--tg-border); border-radius: 4px; padding: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #fff; }
    .lc-alt.sel { border-color: var(--tg-accent); box-shadow: 0 0 0 2px rgba(0,180,216,.2); }
    .lc-alt img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .lc-inc { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--tg-text-secondary); cursor: pointer; }
    .empty { text-align: center; padding: 40px; color: var(--tg-text-tertiary); }
    label.fld { font-size: 11px; color: var(--tg-text-tertiary); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">TG</span><span>Logo Finder<span class="sub">&nbsp;· Control</span></span></div>
    <div class="top-actions">
      <a class="btn" href="/admin/">Control</a>
      <button class="btn" id="theme-btn" title="Toggle theme">Theme</button>
    </div>
  </header>

  <main class="wrap">
    <div id="provider-banner"></div>

    <div class="card">
      <h2>Find logos in bulk</h2>
      <p class="muted">Paste brand names or domains, one per line (e.g. <em>ABTA</em> or <em>abta.com</em>). We look each one up, you pick the good ones, and they go straight into the shared library.</p>
      <textarea id="queries" placeholder="ABTA&#10;ATOL&#10;jet2.com&#10;TUI"></textarea>
      <div class="row">
        <button class="btn primary" id="find-btn">Find logos</button>
        <span class="status" id="find-status"></span>
      </div>
    </div>

    <div id="results-card" class="card" hidden>
      <div class="row" style="justify-content:space-between;margin-top:0">
        <h2 style="margin:0">Results <span class="status" id="result-count"></span></h2>
        <div class="row" style="margin-top:0">
          <button class="btn" id="toggle-all">Select all / none</button>
          <button class="btn primary" id="import-btn">Import selected</button>
        </div>
      </div>
      <div id="import-status" class="status" style="margin:8px 0"></div>
      <div class="results" id="results"></div>
    </div>
  </main>

  <script>
    var state = { results: [] };
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }

    (function(){ var s=null; try{ s=localStorage.getItem('tg-admin-theme'); }catch(e){}
      if(s) document.documentElement.setAttribute('data-theme', s);
      document.getElementById('theme-btn').addEventListener('click', function(){
        var cur=document.documentElement.getAttribute('data-theme'); var nx=cur==='dark'?'light':'dark';
        document.documentElement.setAttribute('data-theme', nx); try{ localStorage.setItem('tg-admin-theme', nx);}catch(e){}
      });
    })();

    function banner(kind, html){ document.getElementById('provider-banner').innerHTML = '<div class="banner '+kind+'">'+html+'</div>'; }

    async function checkProvider(){
      try {
        var r = await fetch('/api/admin/logo-find', { credentials:'include' });
        if (r.status===401){ location.href='/signin.html?redirect='+encodeURIComponent('/admin/logo-find'); return; }
        if (r.status===403){ banner('err','Your account is not on the admin allow-list.'); document.getElementById('find-btn').disabled=true; return; }
        var d = await r.json();
        if (!d.configured){ banner('warn', esc(d.hint||'No logo service key configured yet.')); document.getElementById('find-btn').disabled=true; return; }
        var names=[]; if(d.providers&&d.providers.brandfetch)names.push('Brandfetch'); if(d.providers&&d.providers.logodev)names.push('Logo.dev');
        banner('ok', 'Connected to '+esc(names.join(' + '))+'. '+(d.providers&&d.providers.brandfetch?'Brandfetch leads; Logo.dev is the fallback.':'Enter domains (Logo.dev needs a domain, not a name).'));
      } catch(e){ banner('err','Could not reach the finder API.'); }
    }

    document.getElementById('find-btn').addEventListener('click', doFind);
    async function doFind(){
      var raw = document.getElementById('queries').value.split(/[\n,]/).map(function(s){return s.trim();}).filter(Boolean);
      if (!raw.length){ document.getElementById('find-status').textContent='Add at least one brand or domain.'; return; }
      document.getElementById('find-status').textContent='Searching '+raw.length+'…';
      document.getElementById('find-btn').disabled=true;
      try {
        var r = await fetch('/api/admin/logo-find', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'find', queries: raw }) });
        if (r.status===401){ location.href='/signin.html?redirect='+encodeURIComponent('/admin/logo-find'); return; }
        var d = await r.json();
        if (!r.ok){ document.getElementById('find-status').textContent = d.detail||d.error||('HTTP '+r.status); return; }
        state.results = (d.results||[]).map(function(res){
          return { query:res.query, ok:res.ok, error:res.error, source:res.source, candidates:res.candidates||[],
                   include: res.ok, selIdx: 0, name: (res.candidates&&res.candidates[0]&&res.candidates[0].name)||res.query, category:'' };
        });
        renderResults();
        var hits = state.results.filter(function(x){return x.ok;}).length;
        document.getElementById('find-status').textContent = hits+' of '+state.results.length+' found';
      } catch(e){ document.getElementById('find-status').textContent='Search failed: '+e.message; }
      finally { document.getElementById('find-btn').disabled=false; }
    }

    function renderResults(){
      document.getElementById('results-card').hidden = state.results.length===0;
      document.getElementById('result-count').textContent = state.results.length ? ('· '+state.results.length) : '';
      document.getElementById('results').innerHTML = state.results.map(function(res, i){
        if (!res.ok || !res.candidates.length){
          return '<div class="lc miss off"><div class="lc-preview"></div><div class="lc-body"><div class="lc-q">'+esc(res.query)+'</div><div class="status">'+esc(res.error||'no match')+'</div></div></div>';
        }
        var sel = res.candidates[res.selIdx] || res.candidates[0];
        var alts = res.candidates.length>1 ? '<div class="lc-alts">'+res.candidates.map(function(c,ci){
          return '<span class="lc-alt'+(ci===res.selIdx?' sel':'')+'" data-i="'+i+'" data-ci="'+ci+'"><img src="'+esc(c.url)+'" alt=""></span>';
        }).join('')+'</div>' : '';
        return '<div class="lc'+(res.include?'':' off')+'" data-card="'+i+'">'
          + '<div class="lc-preview"><img src="'+esc(sel.url)+'" alt="'+esc(res.name)+'"></div>'
          + '<div class="lc-body">'
          +   '<div class="lc-head"><span class="lc-q">'+esc(res.query)+'</span><span>'
          +     (res.source?'<span class="pill '+esc(res.source)+'">'+esc(res.source)+'</span> ':'')
          +     (sel.format==='svg'?'<span class="pill svg">SVG</span>':'')
          +   '</span></div>'
          +   alts
          +   '<label class="fld">Name</label><input type="text" data-name="'+i+'" value="'+esc(res.name)+'">'
          +   '<label class="fld">Category (optional)</label><input type="text" data-cat="'+i+'" value="'+esc(res.category)+'" placeholder="e.g. Airline, Trade body">'
          +   '<label class="lc-inc"><input type="checkbox" data-inc="'+i+'"'+(res.include?' checked':'')+'> Import this one</label>'
          + '</div></div>';
      }).join('');
    }

    document.getElementById('results').addEventListener('click', function(e){
      var alt = e.target.closest('.lc-alt');
      if (alt){ var i=+alt.getAttribute('data-i'), ci=+alt.getAttribute('data-ci'); state.results[i].selIdx=ci; renderResults(); }
    });
    document.getElementById('results').addEventListener('change', function(e){
      var t=e.target;
      if (t.hasAttribute('data-inc')){ state.results[+t.getAttribute('data-inc')].include=t.checked; var card=t.closest('.lc'); if(card)card.classList.toggle('off',!t.checked); }
      else if (t.hasAttribute('data-name')){ state.results[+t.getAttribute('data-name')].name=t.value; }
      else if (t.hasAttribute('data-cat')){ state.results[+t.getAttribute('data-cat')].category=t.value; }
    });
    document.getElementById('toggle-all').addEventListener('click', function(){
      var anyOn = state.results.some(function(r){return r.ok && r.include;});
      state.results.forEach(function(r){ if(r.ok) r.include=!anyOn; });
      renderResults();
    });

    document.getElementById('import-btn').addEventListener('click', doImport);
    async function doImport(){
      var items = state.results.filter(function(r){ return r.ok && r.include && r.candidates.length; })
        .map(function(r){ var c=r.candidates[r.selIdx]||r.candidates[0];
          return { name:(r.name||c.name||r.query).trim(), domain:c.domain||'', category:(r.category||'').trim(), url:c.url, type:c.type, format:c.format }; })
        .filter(function(it){ return it.name && it.url; });
      if (!items.length){ document.getElementById('import-status').textContent='Tick at least one logo to import.'; return; }
      document.getElementById('import-btn').disabled=true;
      document.getElementById('import-status').textContent='Importing '+items.length+'…';
      try {
        var r = await fetch('/api/admin/logo-find', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'import', items: items }) });
        var d = await r.json();
        if (!r.ok){ document.getElementById('import-status').textContent = d.detail||d.error||('HTTP '+r.status); return; }
        var msg = 'Imported '+d.imported+'.';
        if (d.skipped&&d.skipped.length) msg += ' Skipped '+d.skipped.length+' (already in library).';
        if (d.failed&&d.failed.length) msg += ' Failed '+d.failed.length+' ('+d.failed.map(function(f){return esc(f.name);}).slice(0,5).join(', ')+').';
        msg += ' Library now holds '+d.totalInLibrary+'.';
        document.getElementById('import-status').innerHTML = '<span style="color:var(--tg-success)">'+msg+'</span>';
        // Drop the successfully imported + skipped from the list so re-import is clean.
        var done = {}; (d.importedItems||[]).forEach(function(x){done[x.name.toLowerCase()]=1;}); (d.skipped||[]).forEach(function(x){done[x.name.toLowerCase()]=1;});
        state.results = state.results.filter(function(x){ return !done[(x.name||'').toLowerCase()]; });
        renderResults();
      } catch(e){ document.getElementById('import-status').textContent='Import failed: '+e.message; }
      finally { document.getElementById('import-btn').disabled=false; }
    }

    checkProvider();
  </script>
</body>
</html>
