<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holiday deal — Tripbuster</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF5C39'/%3E%3Cpath d='M6 16h20M19 9l7 7-7 7M10 12v8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/tripbuster/tb-site.css">
<style>
  .crumb { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--tx-2);
    font-weight:600; padding:14px 0 4px; flex-wrap:wrap; }
  .crumb a { color:var(--sky-deep); font-weight:700; }
  .crumb svg { width:13px; height:13px; stroke:var(--tx-3); fill:none; stroke-width:2.2; }
  .dhead { display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    padding:6px 0 16px; flex-wrap:wrap; }
  .dhead h1 { margin:0 0 6px; font-size:26px; font-weight:800; letter-spacing:-.03em; text-wrap:balance; }
  .hero-img { height:340px; border-radius:16px; background-size:cover; background-position:center;
    position:relative; }
  .hero-img .score-badge { position:absolute; top:14px; left:14px; display:inline-flex; align-items:center;
    gap:8px; background:rgba(255,255,255,.94); padding:7px 11px; border-radius:11px; box-shadow:var(--shadow-sm); }
  .dlayout { display:grid; grid-template-columns:1fr 340px; gap:26px; padding:20px 0 50px; align-items:start; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    box-shadow:var(--shadow-sm); }
  .sec { padding:20px 22px; border-bottom:1px solid var(--border); }
  .sec:last-child { border-bottom:0; }
  .sec h2 { margin:0 0 12px; font-size:17px; font-weight:800; letter-spacing:-.02em; }
  .sec p { margin:0; color:var(--tx-2); font-size:14px; line-height:1.65; }
  .glance { display:flex; gap:8px; flex-wrap:wrap; }
  .facil { display:grid; grid-template-columns:repeat(2,1fr); gap:10px 20px; }
  .fac { display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:600; }
  .fac svg { width:16px; height:16px; stroke:var(--live); fill:none; stroke-width:2.2; flex:none; }
  .points { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
  .points li { display:flex; gap:10px; font-size:14px; }
  .points svg { width:17px; height:17px; stroke:var(--live); fill:none; stroke-width:2.2; flex:none; margin-top:2px; }

  .book { position:sticky; top:76px; }
  .book-card { background:var(--surface); border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow-md); overflow:hidden; }
  .book-top { padding:16px 18px 14px; border-bottom:1px solid var(--border); }
  .book-h { padding:13px 18px 8px; font-size:11px; font-weight:800; letter-spacing:.07em;
    text-transform:uppercase; color:var(--tx-3); display:flex; justify-content:space-between; align-items:center; }
  .book-h span { text-transform:none; letter-spacing:0; font-weight:700; color:var(--live); font-size:11.5px; }
  .agent-row { display:flex; align-items:center; gap:11px; padding:11px 18px; border-top:1px solid var(--border); }
  .agent-row.best { background:var(--live-wash); }
  .ar-av { width:34px; height:34px; border-radius:9px; background:var(--sky-wash); color:var(--sky-deep);
    display:grid; place-items:center; font-weight:800; font-size:13px; flex:none; }
  .agent-row.best .ar-av { background:var(--live); color:#fff; }
  .ar-nm { font-weight:700; font-size:13.5px; }
  .ar-right { margin-left:auto; text-align:right; }
  .ar-price { font-weight:800; font-size:16px; letter-spacing:-.02em; }
  .ar-price small { font-size:10.5px; color:var(--tx-3); font-weight:700; }
  .agent-row.best .ar-price { color:var(--live); }
  .ar-book { margin-top:3px; background:var(--coral); color:#fff; border:0; border-radius:8px;
    padding:7px 14px; font-weight:800; font-size:12px; }
  .ar-book:hover { background:var(--coral-ink); }
  .agent-row:not(.best) .ar-book { background:var(--surface); color:var(--coral-ink); border:1px solid var(--coral); }
  .agent-row:not(.best) .ar-book:hover { background:var(--coral); color:#fff; }
  .book-foot { padding:12px 18px; background:var(--surface-2); font-size:11.5px; color:var(--tx-2);
    display:flex; gap:8px; align-items:flex-start; }
  .book-foot svg { width:15px; height:15px; stroke:var(--tx-3); fill:none; stroke-width:2; flex:none; margin-top:1px; }

  /* click-out interstitial */
  .overlay { position:fixed; inset:0; z-index:100; background:rgba(18,50,73,.55);
    backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:20px; }
  .overlay.on { display:flex; }
  .modal { background:var(--surface); border-radius:18px; box-shadow:var(--shadow-lg);
    max-width:420px; width:100%; overflow:hidden; text-align:center; }
  .modal-top { padding:26px 26px 18px; }
  .plane { width:56px; height:56px; margin:0 auto 16px; border-radius:16px;
    background:linear-gradient(135deg,var(--coral),#FF8A4C); display:grid; place-items:center;
    box-shadow:0 8px 20px rgba(255,92,57,.38); }
  .plane svg { width:28px; height:28px; stroke:#fff; fill:none; stroke-width:2; }
  .modal h2 { margin:0 0 6px; font-size:19px; font-weight:800; letter-spacing:-.02em; }
  .modal h2 span { color:var(--coral-ink); }
  .modal p { margin:0; font-size:13px; color:var(--tx-2); line-height:1.6; }
  .m-protect { margin:18px 26px; padding:12px 14px; border-radius:12px; background:var(--live-wash);
    border:1px dashed color-mix(in srgb,var(--live) 40%, transparent); display:flex; gap:10px;
    text-align:left; font-size:12.5px; color:var(--tx-2); }
  .m-protect svg { width:18px; height:18px; stroke:var(--live); fill:none; stroke-width:2; flex:none; margin-top:1px; }
  .m-protect b { color:var(--tx); }
  .modal-acts { display:flex; gap:10px; padding:4px 26px 22px; }
  .modal-acts .btn { flex:1; }
  .m-note { font-size:11px; color:var(--tx-3); padding:0 26px 18px; }
  @media (max-width:900px) {
    .dlayout { grid-template-columns:1fr; }
    .book { position:static; }
    .facil { grid-template-columns:1fr; }
    .hero-img { height:230px; }
  }
</style>
</head>
<body>
<div id="chrome"></div>

<main id="main" class="wrap">
  <div id="content"><div class="loading">Loading this deal…</div></div>
</main>

<div id="footer"></div>

<!-- Click-out interstitial. Built from the deal already loaded, so it never needs
     a second request before the traveller can leave. -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <div class="modal-top">
      <div class="plane" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 12h20M14 5l7 7-7 7M6 8v8"/></svg></div>
      <h2 id="mTitle">Taking you to <span id="mAgent">the agent</span></h2>
      <p>You will finish booking on their website. Tripbuster does not take the booking or handle your payment.</p>
    </div>
    <div class="m-protect">
      <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
      <span id="mProtect"></span>
    </div>
    <div class="modal-acts">
      <button class="btn btn-ghost" type="button" id="mCancel">Stay here</button>
      <a class="btn btn-primary" id="mGo" href="#" target="_blank" rel="noopener nofollow">Continue</a>
    </div>
    <p class="m-note">Tripbuster earns a small fee when you visit an agent. It never changes the price you pay.</p>
  </div>
</div>

<script src="/tripbuster/tb-site.js"></script>
<script>
(function () {
  'use strict';
  document.getElementById('chrome').innerHTML = TB.header('');
  document.getElementById('footer').innerHTML = TB.footer();

  var $ = function (id) { return document.getElementById(id); };
  var deal = null;

  var dealId = new URLSearchParams(location.search).get('id') || '';
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  function agentList(d) {
    if (d.compare && d.compare.length) return d.compare;
    return [{
      dealId: d.id, agent: d.agent && d.agent.name, agentSlug: d.agent && d.agent.slug,
      atol: d.atol, price: d.priceFrom, clickoutUrl: d.clickoutUrl,
      phone: d.phone, billingMode: d.billingMode,
    }];
  }

  function tick() { return TB.svg('<path d="M20 6 9 17l-5-5"/>'); }

  /** What a given agency charges for. Already resolved server-side. */
  function mode(entry) {
    return (entry && entry.billingMode) || (deal && deal.billingMode) || 'click';
  }

  function render(d) {
    var agents = agentList(d);
    var best = agents[0] || {};
    var place = [d.resort, d.country].filter(Boolean).join(', ');

    var glance = [];
    if (d.board) glance.push('<span class="chip">' + TB.svg(TB.IC.board) + TB.esc(d.board) + '</span>');
    if (d.starRating) glance.push('<span class="chip">' + TB.esc(d.starRating) + '-star hotel</span>');
    if (d.nights) glance.push('<span class="chip">' + TB.svg(TB.IC.moon) + TB.esc(d.nights) + ' nights</span>');
    if (d.distanceToBeach) glance.push('<span class="chip">' + TB.svg(TB.IC.pin) + TB.esc(d.distanceToBeach) + ' to the beach</span>');
    (d.allAirports || []).slice(0, 3).forEach(function (a) {
      glance.push('<span class="chip">' + TB.svg(TB.IC.plane) + TB.esc(a) + '</span>');
    });

    $('content').innerHTML =
      '<div class="crumb"><a href="/tripbuster">Home</a>' + TB.svg('<path d="m9 18 6-6-6-6"/>') +
        (d.country ? '<a href="/tripbuster/search?q=' + encodeURIComponent(d.country) + '">' + TB.esc(d.country) + '</a>' +
          TB.svg('<path d="m9 18 6-6-6-6"/>') : '') +
        '<span>' + TB.esc(d.accommodation || d.title) + '</span></div>' +

      '<div class="dhead"><div>' +
        '<h1>' + TB.esc(d.accommodation || d.title) + ' ' + TB.starsMarkup(d.starRating) + '</h1>' +
        '<div class="rc-loc">' + TB.svg(TB.IC.pin) + TB.esc(place) +
          (d.distanceToBeach ? ' · ' + TB.esc(d.distanceToBeach) + ' to the beach' : '') + '</div>' +
      '</div></div>' +

      '<div class="hero-img ' + TB.gradClass(d.resort || d.title) + '"' + TB.bgStyle(d) + '>' +
        (d.guestScore
          ? '<div class="score-badge"><span class="score-box" style="background:' + TB.scoreColour(d.guestScore) + '">' +
            TB.esc(Number(d.guestScore).toFixed(1)) + '</span><span class="score-txt"><b>' +
            TB.esc(TB.scoreWord(d.guestScore)) + '</b><span>guest rating</span></span></div>'
          : '') +
      '</div>' +

      '<div class="dlayout">' +
        '<div class="card">' +
          '<div class="sec"><h2>' + TB.esc(d.title) + '</h2>' +
            (d.strapline ? '<p style="margin-bottom:12px">' + TB.esc(d.strapline) + '</p>' : '') +
            '<div class="glance">' + glance.join('') + '</div></div>' +

          (d.overview ? '<div class="sec"><h2>About this holiday</h2><p>' + TB.esc(d.overview) + '</p></div>' : '') +

          ((d.sellingPoints || []).length
            ? '<div class="sec"><h2>Why this one</h2><ul class="points">' +
              d.sellingPoints.map(function (p) { return '<li>' + tick() + '<span>' + TB.esc(p) + '</span></li>'; }).join('') +
              '</ul></div>'
            : '') +

          ((d.facilities || []).length
            ? '<div class="sec"><h2>Facilities</h2><div class="facil">' +
              d.facilities.map(function (f) { return '<div class="fac">' + tick() + TB.esc(f) + '</div>'; }).join('') +
              '</div></div>'
            : '') +

          '<div class="sec"><h2>Good to know</h2><p>' +
            'This holiday is advertised on Tripbuster by ' +
            (agents.length > 1 ? TB.esc(agents.length) + ' independent UK travel agents' : '<strong>' + TB.esc(best.agent) + '</strong>') +
            '. You book with the agent you choose, on their own website, and they hold the financial protection for your trip. ' +
            'Tripbuster never takes a booking or handles your money.' +
            (d.availability && d.availability !== 'Available'
              ? ' Availability is currently marked <strong>' + TB.esc(d.availability.toLowerCase()) + '</strong>.'
              : '') +
          '</p></div>' +
        '</div>' +

        '<aside class="book"><div class="book-card">' +
          '<div class="book-top">' +
            '<div class="rc-from">' + (d.nights ? TB.esc(d.nights) + ' nights · ' : '') +
              TB.esc(d.board || '') + ' · from</div>' +
            TB.priceBlock(d) +
            (d.dates ? '<div class="chips" style="margin-top:9px"><span class="chip">' +
              TB.svg(TB.IC.cal) + TB.esc(d.dates) + '</span></div>' : '') +
          '</div>' +
          '<div class="book-h">' + (agents.length > 1 ? 'Compare ' + agents.length + ' agents' : 'Book with') +
            '<span>You book direct</span></div>' +
          agents.map(function (a, i) {
            var initials = String(a.agent || '?').split(/\s+/).map(function (w) { return w[0]; })
              .join('').slice(0, 2).toUpperCase();
            return '<div class="agent-row' + (i === 0 ? ' best' : '') + '">' +
              '<span class="ar-av">' + TB.esc(initials) + '</span>' +
              '<span><span class="ar-nm">' + TB.esc(a.agent) +
                (i === 0 && agents.length > 1 ? '<span class="best-tag">CHEAPEST</span>' : '') + '</span>' +
                (a.atol ? '<span class="prot" style="font-size:11px">' + TB.svg(TB.IC.shield) +
                  'ATOL ' + TB.esc(a.atol) + '</span>' : '') + '</span>' +
              '<span class="ar-right"><span class="ar-price tnum">' +
                TB.esc(TB.money(a.price, d.currency)) + '<small> pp</small></span><br>' +
                // Which routes this agency offers. On "both" the traveller gets
                // the choice; on call-only there is nothing to click through to.
                (mode(a) !== 'call' && a.clickoutUrl
                  ? '<button class="ar-book" type="button" data-idx="' + i + '">Book</button>' : '') +
                (mode(a) !== 'click'
                  ? TB.callCta(a, { className: 'btn btn-call ar-call',
                    label: TB.dialer() ? 'Call' : 'Show number' }) : '') +
              '</span></div>';
          }).join('') +
          '<div class="book-foot">' + TB.svg('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>') +
            '<span>Tripbuster is free to use. Each holiday is sold and financially protected by the agent you book with.</span>' +
          '</div>' +
        '</div>' +
        // Offered whenever the cheapest agency takes calls. It suits the people
        // a phone number does not: anyone browsing at their desk, anyone who
        // would rather be emailed, and anyone looking outside office hours.
        (mode(best) !== 'click' ? TB.callbackForm(d) : '') +
        '</aside>' +
      '</div>';

    // Both are delegated, so a later re-render needs no re-binding.
    TB.wireCalls($('content'), 'site');
    var cbf = $('content').querySelector('.cbf');
    if (cbf) TB.wireCallback(cbf, d, 'site');

    // The deal was shown, so report it.
    TB.reportImpressions([d], 'site');
  }

  // ── click-out ───────────────────────────────────────────────
  var overlay = $('overlay');
  var pending = null;
  var lastFocus = null;

  function openOut(agentEntry) {
    var href = TB.safeUrl(agentEntry.clickoutUrl);
    if (!href) return; // nothing to send them to; leave the page as it is
    pending = { id: agentEntry.dealId || (deal && deal.id), href: href };
    lastFocus = document.activeElement;
    $('mAgent').textContent = agentEntry.agent || 'the agent';
    $('mProtect').innerHTML = 'This holiday is sold and financially protected by <b>' +
      TB.esc(agentEntry.agent || 'the agent') + '</b>' +
      (agentEntry.atol ? ' under <b>ATOL ' + TB.esc(agentEntry.atol) + '</b>' : '') +
      '. You pay them direct.';
    $('mGo').setAttribute('href', href);
    $('mGo').textContent = 'Continue to ' + (agentEntry.agent || 'the agent');
    overlay.classList.add('on');
    $('mGo').focus();
  }

  function closeOut() {
    overlay.classList.remove('on');
    pending = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  $('mCancel').addEventListener('click', closeOut);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOut(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && overlay.classList.contains('on')) closeOut(); });

  // Recorded here, at the moment the traveller commits to leaving — not when the
  // interstitial opened. Counting a click the agent never received would
  // over-bill them.
  $('mGo').addEventListener('click', function () {
    if (pending) TB.reportClick(pending.id, 'site');
    setTimeout(closeOut, 100);
  });

  $('content').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-idx]');
    if (!btn || !deal) return;
    var agents = agentList(deal);
    var entry = agents[Number(btn.getAttribute('data-idx'))];
    if (entry) openOut(entry);
  });

  // ── load ────────────────────────────────────────────────────
  async function load() {
    if (!UUID_RE.test(dealId)) {
      $('content').innerHTML = '<div class="empty" style="margin:30px 0"><b>We could not find that deal</b>' +
        'The link may be out of date. <a href="/tripbuster/search">Browse all deals</a> instead.</div>';
      return;
    }
    try {
      // There is no single-deal endpoint yet, so the deal is found through the
      // compare feed. That is what gives the page every agent's price for the
      // same hotel in one request. A dedicated /deals/:id would be tidier and is
      // worth adding once the catalogue grows past a page of results.
      var data = await TB.fetchDeals({ compare: 1, limit: 60 });
      var found = null;
      (data.deals || []).some(function (d) {
        if (d.id === dealId) { found = d; return true; }
        // The cheapest deal represents the group, so the requested id may be a
        // rival inside the compare list.
        var hit = (d.compare || []).some(function (c) { return c.dealId === dealId; });
        if (hit) { found = d; return true; }
        return false;
      });

      if (!found) {
        $('content').innerHTML = '<div class="empty" style="margin:30px 0"><b>This deal is no longer available</b>' +
          'It may have sold out or expired. <a href="/tripbuster/search">See what else is on</a>.</div>';
        return;
      }
      deal = found;
      document.title = (found.accommodation || found.title) + ' — Tripbuster';
      render(found);
    } catch (err) {
      $('content').innerHTML = '<div class="empty" style="margin:30px 0"><b>Could not load this deal</b>' +
        TB.esc(err.message) + '</div>';
    }
  }
  load();
})();
</script>
</body>
</html>
