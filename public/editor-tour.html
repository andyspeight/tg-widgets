<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour Builder — Travelgenix</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Shell CSS for the design tokens (--tgse-*), login overlay, toasts, modal. -->
<link rel="stylesheet" href="/editor-shell.css">
<style>
  /* ── Full-width Tour Builder (bespoke layout; tgse drives auth + save) ── */
  body { margin: 0; background: var(--tgse-bg-page); color: var(--tgse-ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .tb-app { display: flex; flex-direction: column; min-height: 100vh; }

  /* Toolbar */
  .tb-bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--tgse-panel); border-bottom: 1px solid var(--tgse-border); }
  .tb-back { display: inline-flex; align-items: center; gap: 6px; color: var(--tgse-ink-3); text-decoration: none; font-size: 13px; font-weight: 600; }
  .tb-back svg { width: 18px; height: 18px; }
  .tb-id { display: flex; align-items: center; gap: 10px; }
  .tb-id-tile { width: 34px; height: 34px; border-radius: 8px; background: var(--tgse-brand); color: #fff; display: grid; place-items: center; }
  .tb-id-tile svg { width: 18px; height: 18px; }
  .tb-id-name { font-size: 13px; font-weight: 700; }
  .tb-id-sub { font-size: 11px; color: var(--tgse-ink-3); }
  #name-input { padding: 8px 11px; font: inherit; font-size: 14px; border: 1px solid var(--tgse-border); border-radius: var(--tgse-radius-sm); background: var(--tgse-panel); color: var(--tgse-ink); min-width: 240px; }
  .tb-spacer { flex: 1; }
  .tb-toggle { display: inline-flex; padding: 3px; background: var(--tgse-panel-3); border-radius: 999px; }
  .tb-toggle button { border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: var(--tgse-ink-3); padding: 6px 16px; border-radius: 999px; cursor: pointer; }
  .tb-toggle button.is-on { background: var(--tgse-panel); color: var(--tgse-ink); box-shadow: var(--tgse-shadow-sm); }
  .tb-btn { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--tgse-border); background: var(--tgse-panel); color: var(--tgse-ink); padding: 8px 14px; border-radius: var(--tgse-radius-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .tb-btn svg { width: 16px; height: 16px; }
  .tb-btn--primary { background: var(--tgse-brand); border-color: var(--tgse-brand); color: #fff; }
  .tb-btn--primary.is-dirty { background: var(--tgse-warning); border-color: var(--tgse-warning); }

  /* Views — split by default: controls left, live preview right (always shown) */
  .tb-body { flex: 1; display: flex; align-items: flex-start; }
  .tb-build { flex: 1 1 auto; min-width: 0; padding: 24px 30px 90px; }
  .tb-preview { flex: 0 0 480px; align-self: stretch; background: var(--tgse-panel-2); }
  .tb-preview-inner { position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; background: #fff; border-left: 1px solid var(--tgse-border); }
  /* Full-preview mode hides the form and lets the tour fill the width */
  .tb-app[data-view="preview"] .tb-build { display: none; }
  .tb-app[data-view="preview"] .tb-preview { flex-basis: 100%; }
  .tb-app[data-view="preview"] .tb-preview-inner { border-left: 0; }
  /* Narrow screens: the side preview would be too tight, so hide it in split
     mode and let the user pop the full preview instead. */
  @media (max-width: 1040px) {
    .tb-app[data-view="editor"] .tb-preview { display: none; }
  }

  /* Sections (accordions) */
  .sec { border: 1px solid var(--tgse-border); border-radius: var(--tgse-radius-md); margin-bottom: 14px; background: var(--tgse-panel); overflow: hidden; }
  .sec-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; user-select: none; }
  .sec-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .sec-head .chev { margin-left: auto; transition: transform 0.15s ease; color: var(--tgse-ink-3); }
  .sec.is-open .chev { transform: rotate(180deg); }
  .sec-body { display: none; padding: 4px 16px 18px; }
  .sec.is-open .sec-body { display: block; }
  .sec-hint { font-size: 12px; color: var(--tgse-muted); margin: 0 0 14px; }
  .sec-note { display: flex; gap: 11px; padding: 13px 14px; border-radius: var(--tgse-radius-sm); background: var(--tgse-brand-tint); border: 1px solid var(--tgse-border); font-size: 12.5px; line-height: 1.55; color: var(--tgse-ink); margin-bottom: 12px; }
  .sec-note:last-child { margin-bottom: 0; }
  .sec-note svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--tgse-brand); margin-top: 1px; }
  .sec-note strong { font-weight: 700; }

  /* Fields */
  .fld { margin-bottom: 14px; }
  .fld > label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  .fld .hint { font-size: 11px; color: var(--tgse-muted); margin-top: 5px; }
  .in, .ta, .sel { width: 100%; padding: 9px 11px; font: inherit; font-size: 13px; border: 1px solid var(--tgse-border); border-radius: var(--tgse-radius-sm); background: var(--tgse-panel); color: var(--tgse-ink); }
  .in:focus, .ta:focus, .sel:focus { outline: none; border-color: var(--tgse-brand); box-shadow: 0 0 0 3px var(--tgse-brand-tint); }
  .ta { resize: vertical; min-height: 70px; line-height: 1.5; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .row2, .row3 { grid-template-columns: 1fr; } }
  .money { display: flex; align-items: stretch; }
  .money-sym { padding: 9px 11px; border: 1px solid var(--tgse-border); border-right: 0; border-radius: var(--tgse-radius-sm) 0 0 var(--tgse-radius-sm); background: var(--tgse-panel-2); color: var(--tgse-ink-3); font-size: 13px; }
  .money .in { border-radius: 0 var(--tgse-radius-sm) var(--tgse-radius-sm) 0; }
  .colour { display: flex; align-items: center; gap: 8px; }
  .colour-sw { position: relative; width: 34px; height: 34px; border-radius: var(--tgse-radius-sm); border: 1px solid var(--tgse-border); overflow: hidden; flex-shrink: 0; }
  .colour-sw input { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); border: 0; padding: 0; background: transparent; cursor: pointer; }
  .sw { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .sw input { width: 16px; height: 16px; }

  /* Repeatable rows */
  .rep-row { border: 1px solid var(--tgse-border); border-radius: var(--tgse-radius-md); padding: 12px; margin-bottom: 10px; background: var(--tgse-panel-2); position: relative; }
  .rep-del { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; color: var(--tgse-ink-3); cursor: pointer; font-size: 12px; padding: 3px 6px; border-radius: 6px; }
  .rep-del:hover { color: var(--tgse-danger); background: var(--tgse-hover); }
  .rep-title { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--tgse-ink-3); margin: 0 0 10px; }
  .add-btn { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--tgse-brand); background: var(--tgse-brand-tint); border: 1px dashed var(--tgse-brand); border-radius: var(--tgse-radius-sm); padding: 8px 12px; cursor: pointer; }

  /* Image field: URL input + Upload button (uploads to Vercel Blob, stores the URL) */
  .img-row { display: flex; gap: 8px; align-items: stretch; }
  .img-row .in { flex: 1 1 auto; min-width: 0; }
  .up-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--tgse-brand); background: var(--tgse-brand-tint); border: 1px solid var(--tgse-brand); border-radius: var(--tgse-radius-sm); padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  .up-btn:hover { background: var(--tgse-brand); color: #fff; }
  .up-btn:disabled { opacity: .6; cursor: default; }
  .up-btn svg { width: 15px; height: 15px; }
  .sub { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--tgse-border); }
  .sub-label { font-size: 11px; font-weight: 700; color: var(--tgse-ink-3); margin-bottom: 8px; }
</style>
</head>
<body>

<div class="tb-app" data-view="editor" id="tb-app">

  <!-- Toolbar -->
  <div class="tb-bar">
    <a href="/" class="tb-back" id="btn-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="tb-id">
      <span class="tb-id-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
      </span>
      <div>
        <div class="tb-id-name">Tour Builder</div>
        <div class="tb-id-sub">Escorted Tour</div>
      </div>
    </div>
    <input type="text" id="name-input" placeholder="Untitled tour" maxlength="120">
    <div class="tb-spacer"></div>
    <div class="tb-toggle" role="group" aria-label="View">
      <button type="button" data-view="editor" class="is-on">Editor</button>
      <button type="button" data-view="preview">Full preview</button>
    </div>
    <button type="button" class="tb-btn" id="btn-import" title="Fill the builder from a PDF brochure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><polyline points="9 15 12 12 15 15"/></svg>
      <span id="import-label">Import PDF</span>
    </button>
    <input type="file" id="import-file" accept="application/pdf,.pdf" hidden>
    <button type="button" class="tb-btn" id="btn-embed" title="Get embed code">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      Embed
    </button>
    <button type="button" class="tb-btn tb-btn--primary" id="btn-save" title="Save (⌘S)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span id="save-label">Save</span>
    </button>
  </div>

  <div class="tb-body">
    <div class="tb-build" id="tb-build"><!-- sections injected here --></div>
    <div class="tb-preview">
      <!-- No data-tg-widget here: the editor constructs the preview by hand, so
           widget-tour.js auto-init never claims this mount (attachShadow once). -->
      <div class="tb-preview-inner"><div id="tour-mount"></div></div>
    </div>
  </div>

</div>

<script src="/editor-shell.js"></script>
<script src="/widget-tour.js"></script>
<script>
/* ============================================================================
   Tour Builder — bespoke full-width editor. tgse (the unified shell engine)
   handles auth, login, the save flow, the embed modal and Cmd+S; this file
   owns a wide, purpose-built editing surface for the rich escorted-tour config.
   ========================================================================== */
(function () {
  'use strict';

  // ── Default starter tour (a short 2-day sample, enough to preview) ──
  function starter() {
    return {
      tour: {
        title: 'Your escorted tour', subtitle: 'A short line that sells the trip.',
        location: '', heroImage: '', currency: 'gbp',
        startDate: '', endDate: '', durationText: '',
        capacity: 0, pricePerPersonPence: 0, singleSupplementPence: 0,
        depositPence: 0, balanceDueDate: '', priceNote: '', pageUrl: '',
      },
      glance: [],
      highlights: [],
      days: [
        { label: 'Day 1', date: '', title: 'Arrival', body: 'Describe the first day.', facts: [{ label: 'Accommodation', value: '' }], images: [], optionalActivities: [] },
      ],
      extras: [],
      included: [], excluded: [],
      sections: [],
      gallery: [],
      enquiry: { heading: 'Enquire about this tour', intro: 'Leave your details and we will be in touch about dates and availability.', buttonText: 'Send enquiry', successMessage: 'Thank you. Your enquiry is on its way and we will get back to you shortly.' },
      design: { brandColor: '#1B2B5B', accentColor: '#C2410C', theme: 'light', radius: 16, fontFamily: 'DM Sans' },
    };
  }

  let C = starter();
  let tourInst = null;
  let previewTimer = null;

  const $ = (id) => document.getElementById(id);
  const SYMS = { gbp: '£', eur: '€', usd: '$' };

  // ── Tiny DOM builder ──
  function mk(tag, props) {
    const e = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'value') e.value = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v != null) e.setAttribute(k, v);
    }
    for (let i = 2; i < arguments.length; i++) {
      const kid = arguments[i]; if (kid == null) continue;
      (Array.isArray(kid) ? kid : [kid]).forEach(x => { if (x != null) e.append(x.nodeType ? x : document.createTextNode(x)); });
    }
    return e;
  }

  // ── Money: inputs are major units, config stores pence ──
  function penceToMajor(p) { const n = Number(p); if (!isFinite(n) || n <= 0) return ''; return (Math.round(n) % 100 === 0) ? String(n / 100) : (n / 100).toFixed(2); }
  function majorToPence(v) { const n = parseFloat(String(v).replace(/[^0-9.]/g, '')); if (!isFinite(n) || n < 0) return 0; return Math.min(100000000, Math.round(n * 100)); }

  function dirty() { if (window.tgse) tgse.markDirty(); schedulePreview(); }
  function schedulePreview() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(renderPreview, 180);
  }
  function renderPreview() {
    const mount = $('tour-mount');
    if (!mount) return;
    // Adopt an auto-init instance if one ever claimed the mount (belt-and-braces
    // — the mount has no data-tg-widget, so normally this is null).
    if (!tourInst) tourInst = mount._tgWidget || null;
    if (tourInst) { tourInst.update(C); return; }
    tourInst = new window.TGTourWidget(mount, C);
  }

  // ── Field factories ──
  function field(labelText, control, hint) {
    return mk('div', { class: 'fld' }, labelText ? mk('label', { text: labelText }) : null, control, hint ? mk('div', { class: 'hint', text: hint }) : null);
  }
  function textIn(get, set, ph, ml) {
    return mk('input', { class: 'in', type: 'text', value: get() || '', placeholder: ph || '', maxlength: ml || 300, oninput: (e) => { set(e.target.value); dirty(); } });
  }
  function textArea(get, set, ph, ml) {
    return mk('textarea', { class: 'ta', placeholder: ph || '', maxlength: ml || 6000, oninput: (e) => { set(e.target.value); dirty(); } }, get() || '');
  }
  function dateIn(get, set) {
    return mk('input', { class: 'in', type: 'date', value: get() || '', oninput: (e) => { set(e.target.value); dirty(); } });
  }
  function numIn(get, set, min, max) {
    return mk('input', { class: 'in', type: 'number', min: min, max: max, value: get() || '', oninput: (e) => { let n = parseInt(e.target.value, 10); if (isNaN(n)) n = 0; n = Math.max(min, Math.min(max, n)); set(n); dirty(); } });
  }
  function moneyIn(getPence, setPence) {
    const inp = mk('input', { class: 'in', type: 'text', inputmode: 'decimal', value: penceToMajor(getPence()), placeholder: '0' });
    inp.addEventListener('input', () => { setPence(majorToPence(inp.value)); dirty(); });
    inp.addEventListener('blur', () => { inp.value = penceToMajor(getPence()); });
    inp._sym = mk('span', { class: 'money-sym', 'data-sym': '1', text: SYMS[C.tour.currency] || '£' });
    return mk('div', { class: 'money' }, inp._sym, inp);
  }
  function listArea(getArr, setArr, ph) {
    const ta = mk('textarea', { class: 'ta', placeholder: ph || 'One per line' }, (getArr() || []).join('\n'));
    ta.addEventListener('input', () => { setArr(ta.value.split('\n').map(s => s.trim()).filter(Boolean)); dirty(); });
    return ta;
  }

  // ── Image upload ───────────────────────────────────────────────────────────
  // Reuses the suite's existing /api/upload-photo token flow (the one the offers
  // builder uses): the file streams straight to Vercel Blob and we store ONLY
  // the returned https URL in the config — never base64 — so the widget stays
  // CSP-clean and the saved config stays small. The Blob client is imported from
  // a CDN on first use (editor pages allow that; widgets never do).
  const UPLOAD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
  let _blobMod = null;
  function blobClient() {
    if (_blobMod) return Promise.resolve(_blobMod);
    return import('https://esm.sh/@vercel/blob@0.27.0/client').then((m) => (_blobMod = m));
  }
  const IMG_TYPES = /^image\/(jpeg|jpg|png|webp|gif|avif)$/i;
  function validImage(f) {
    if (!f || !IMG_TYPES.test(f.type)) { toast('Choose a JPG, PNG, WebP or GIF image', 'err'); return false; }
    if (f.size > 8 * 1024 * 1024) { toast('That image is over 8MB — please pick a smaller file', 'err'); return false; }
    return true;
  }
  function toast(msg, kind) { if (window.tgse && tgse.toast) tgse.toast(msg, kind); }
  async function uploadImage(file) {
    const mod = await blobClient();
    const clean = String(file.name || 'image').replace(/[^a-zA-Z0-9._-]/g, '-').slice(-64);
    const blob = await mod.upload('offer-photos/tour-' + Date.now() + '-' + clean, file, {
      access: 'public', contentType: file.type, handleUploadUrl: '/api/upload-photo',
    });
    return blob && blob.url;
  }
  function upButton(label) {
    const lbl = mk('span', { text: label });
    return { btn: mk('button', { type: 'button', class: 'up-btn' }, mk('span', { html: UPLOAD_ICON }), lbl), lbl };
  }

  // Single image: a URL input + an Upload button. An uploaded file fills the URL.
  function imageIn(get, set, ph) {
    const url = textIn(get, set, ph || 'https://… or upload', 500);
    const file = mk('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp,image/gif', hidden: 'hidden' });
    const { btn, lbl } = upButton('Upload');
    btn.addEventListener('click', () => file.click());
    file.addEventListener('change', async () => {
      const f = file.files && file.files[0]; file.value = '';
      if (!f || !validImage(f)) return;
      btn.disabled = true; lbl.textContent = 'Uploading…';
      try {
        const u = await uploadImage(f);
        if (!u) throw new Error('no url');
        set(u); url.value = u; dirty(); toast('Image uploaded', 'ok');
      } catch (e) { toast('Upload failed — you can paste a URL instead', 'err'); }
      btn.disabled = false; lbl.textContent = 'Upload';
    });
    return mk('div', {}, mk('div', { class: 'img-row' }, url, btn), file);
  }

  // Image list: the newline textarea PLUS an Upload button that appends uploads.
  function imageListIn(getArr, setArr, ph) {
    const ta = listArea(getArr, setArr, ph);
    const file = mk('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp,image/gif', multiple: 'multiple', hidden: 'hidden' });
    const { btn, lbl } = upButton('Upload photos');
    btn.addEventListener('click', () => file.click());
    file.addEventListener('change', async () => {
      const files = Array.prototype.slice.call(file.files || []); file.value = '';
      if (!files.length) return;
      btn.disabled = true; lbl.textContent = 'Uploading…';
      let added = 0;
      for (const f of files) {
        if (!validImage(f)) continue;
        try { const u = await uploadImage(f); if (u) { const arr = (getArr() || []).slice(); arr.push(u); setArr(arr); added++; } } catch (e) { /* skip one, keep going */ }
      }
      ta.value = (getArr() || []).join('\n');
      dirty();
      btn.disabled = false; lbl.textContent = 'Upload photos';
      toast(added ? (added + ' photo' + (added > 1 ? 's' : '') + ' uploaded') : 'Upload failed — you can paste URLs instead', added ? 'ok' : 'err');
    });
    return mk('div', {}, mk('div', { class: 'img-row', style: 'margin-bottom:8px' }, btn), ta, file);
  }
  function colourIn(get, set) {
    const hex = mk('input', { class: 'in', type: 'text', maxlength: 9, value: get() || '' });
    const sw = mk('input', { type: 'color', value: /^#[0-9a-fA-F]{6}$/.test(get() || '') ? get() : '#1B2B5B' });
    const apply = (v) => { if (!/^#[0-9a-fA-F]{3,8}$/.test(v.trim())) return; set(v.trim()); hex.value = v.trim(); if (/^#[0-9a-fA-F]{6}$/.test(v.trim())) sw.value = v.trim(); dirty(); };
    hex.addEventListener('change', () => apply(hex.value));
    sw.addEventListener('input', () => apply(sw.value));
    return mk('div', { class: 'colour' }, mk('span', { class: 'colour-sw' }, sw), hex);
  }
  function selectIn(opts, get, set) {
    const sel = mk('select', { class: 'sel', onchange: (e) => { set(e.target.value); dirty(); } });
    opts.forEach(o => { const op = mk('option', { value: o.v }, o.t); if (o.v === get()) op.selected = true; sel.append(op); });
    return sel;
  }
  function switchIn(labelText, get, set) {
    const cb = mk('input', { type: 'checkbox', onchange: (e) => { set(e.target.checked); dirty(); } });
    cb.checked = !!get();
    return mk('label', { class: 'sw' }, cb, labelText);
  }

  // ── Generic repeater ──
  // host: container; arr: the live array in C; factory: () => new item;
  // rowFn: (item) => DOM node for its fields (no remove button — added here).
  function repeater(host, arr, factory, rowFn, addLabel, rowTitle) {
    const list = mk('div');
    const renderRow = (item) => {
      const body = rowFn(item);
      const del = mk('button', { class: 'rep-del', type: 'button', text: 'Remove', onclick: () => {
        const i = arr.indexOf(item); if (i >= 0) arr.splice(i, 1);
        row.remove(); dirty();
      } });
      const row = mk('div', { class: 'rep-row' }, del, rowTitle ? mk('div', { class: 'rep-title', text: rowTitle }) : null, body);
      return row;
    };
    (arr || []).forEach(it => list.append(renderRow(it)));
    const add = mk('button', { class: 'add-btn', type: 'button', text: addLabel, onclick: () => {
      const it = factory(); arr.push(it); list.append(renderRow(it)); dirty();
    } });
    host.append(list, add);
  }

  // ── Section shell ──
  function section(title, hint, open, buildBody) {

    );
    const sec = mk('div', { class: 'sec' + (open ? ' is-open' : '') }, head, body);
    head.addEventListener('click', () => sec.classList.toggle('is-open'));
    return sec;
  }

      repeater(b, C.sections, () => ({ type: 'text', heading: '', body: '', items: [], columns: [], image: '' }), (s) => {

        // Columns (columns)

        repeater(cols, s.columns, () => ({ heading: '', items: [] }), (col) => {

    // Gallery
    root.append(section('Gallery', 'Upload photos, or paste one image URL per line.', false, (b) => {
      b.append(field('', imageListIn(() => C.gallery, v => C.gallery = v, 'https://…')));

    // Enquiry
    root.append(section('Enquiry form', 'The wording of the built-in enquiry form.', false, (b) => {
      const e = C.enquiry;

      b.append(mk('div', { class: 'row2' },
        field('Button label', textIn(() => e.buttonText, v => e.buttonText = v, 'Send enquiry', 40)),

    // Design
    root.append(section('Design', 'Brand the page to match the agency site.', false, (b) => {
      const d = C.design;
      b.append(mk('div', { class: 'row2' },
        field('Brand colour', colourIn(() => d.brandColor, v => d.brandColor = v)),

      ));
      b.append(mk('div', { class: 'row3' },
        field('Font', selectIn((window.tgse && tgse.FONTS ? tgse.FONTS : ['DM Sans', 'Inter']).map(f => ({ v: f, t: f })), () => d.fontFamily, v => d.fontFamily = v)),

    // Settings — how bookings and enquiries are handled (roadmap + orientation,

    root.append(section('Settings', 'How bookings and enquiries are handled.', false, (b) => {
      const note = (html) => mk('div', { class: 'sec-note', html });
      b.append(note(

        + '<div><strong>Payments and deposits are on their way.</strong> You will connect your own Stripe account here and take deposits straight from the tour page. Travelgenix never holds your travellers\' money. For now the deposit and prices you set under Tour basics are shown to travellers but not charged, so the page gathers enquiries.</div>'
      ));
      b.append(note(
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'
        + '<div><strong>Enquiries reach your Travelgenix leads.</strong> Every enquiry from this page lands in your leads inbox with the traveller\'s details and message. Change the wording of the form under Enquiry form above.</div>'
      ));
      b.append(note(
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>'
        + '<div><strong>Show tours two-up with the compact card.</strong> Each tour has a small card (hero, dates and price). Click a card and the full tour opens in a pop-over on the same page, so you only ever place the card. Two cards sit side by side and stack on mobile.</div>'
      ));
      b.append(field('Full tour page link (optional)', textIn(() => t.pageUrl, v => t.pageUrl = v, 'https://your-site.com/tours/your-tour', 500),
        'Leave blank to open the tour in a pop-over. Set it only if you would rather send visitors to a separate page you have built.'));
    }));
  }

  function syncSyms() {
    document.querySelectorAll('[data-sym]').forEach(el => { el.textContent = SYMS[C.tour.currency] || '£'; });
  }

  // ── Deep merge for loaded config ──
  function deepMerge(base, over) {
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    for (const k of Object.keys(over || {})) {
      const v = over[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) out[k] = deepMerge(base[k], v);
      else out[k] = v;
    }
    return out;
  }

  // ── Import from PDF ──────────────────────────────────────────────────────
  // Read the brochure's text in the browser (pdf.js, loaded on demand from a
  // CDN — editor pages may, widgets never), post the TEXT (not the file) to the
  // AI import path, then fill the builder for review. The AI output is clamped
  // by the tour widget's _defaults() on preview and sanitised again on save.
  let _pdfjs = null;
  function pdfjsLib() {
    if (_pdfjs) return Promise.resolve(_pdfjs);
    return import('https://esm.sh/pdfjs-dist@4/build/pdf.min.mjs').then((m) => {
      try { m.GlobalWorkerOptions.workerSrc = 'https://esm.sh/pdfjs-dist@4/build/pdf.worker.min.mjs'; } catch (e) { /* main-thread fallback */ }
      _pdfjs = m; return m;
    });
  }
  async function extractPdfText(file) {
    const mod = await pdfjsLib();
    const buf = await file.arrayBuffer();
    const pdf = await mod.getDocument({ data: new Uint8Array(buf) }).promise;
    const pages = Math.min(pdf.numPages || 0, 80);
    const out = [];
    for (let i = 1; i <= pages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      out.push((content.items || []).map((it) => (it && it.str) || '').join(' '));
    }
    try { await pdf.destroy(); } catch (e) { /* ignore */ }
    return out.join('\n\n').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  }
  function setImport(busy, label) {
    const btn = $('btn-import'), lbl = $('import-label');
    if (btn) btn.disabled = !!busy;
    if (lbl) lbl.textContent = busy ? (label || 'Working…') : 'Import PDF';
  }
  let _importing = false;
  async function importFromPdf(file) {
    if (_importing || !file) return;
    if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name || '')) { toast('Please choose a PDF file', 'err'); return; }
    if (file.size > 20 * 1024 * 1024) { toast('That PDF is over 20MB — please try a smaller file', 'err'); return; }
    // Confirm before wiping real existing content (never on a fresh starter).
    const hasContent = (C.tour && C.tour.title && C.tour.title !== 'Your escorted tour') || (Array.isArray(C.days) && C.days.length > 1);
    if (hasContent && !window.confirm('Import will fill the builder from this PDF and replace the current tour. Continue?')) return;

    _importing = true; setImport(true, 'Reading PDF…');
    let text = '';
    try { text = await extractPdfText(file); }
    catch (e) { _importing = false; setImport(false); toast('Could not read that PDF. If it is scanned images the text cannot be read — paste it into the fields instead.', 'err'); return; }
    if (!text || text.length < 200) { _importing = false; setImport(false); toast('That PDF had almost no readable text — it may be scanned images.', 'err'); return; }

    setImport(true, 'Understanding the itinerary…');
    let data = {};
    try {
      const res = await fetch('/api/widget-ai', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, (window.tgse && tgse.authHeaders) ? tgse.authHeaders() : {}),
        body: JSON.stringify({ action: 'import-tour', text }),
      });
      if (res.status === 401) { _importing = false; setImport(false); toast('Please sign in again to import.', 'err'); return; }
      data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('Import failed (HTTP ' + res.status + ')'));
    } catch (e) { _importing = false; setImport(false); toast((e && e.message) || 'Import failed. Please try again.', 'err'); return; }

    const imported = data.config;
    if (!imported || !imported.tour || !imported.tour.title) { _importing = false; setImport(false); toast('The import did not find a tour in that PDF.', 'err'); return; }
    C = deepMerge(starter(), imported);
    if (imported.tour.title) $('name-input').value = String(imported.tour.title).slice(0, 120);
    buildForm(); renderPreview(); if (window.tgse) tgse.markDirty();
    _importing = false; setImport(false);
    toast('Imported. Review the details, add prices and photos, then Save.', 'ok');
  }

  // ── tgse (auth + save engine) ──
  const shell = tgse.init({
    widgetType: 'Escorted Tour',
    widgetTag: 'tour',
    scriptFile: 'widget-tour.js',
    getConfig: () => C,
    setConfig: (c) => { C = deepMerge(starter(), c); buildForm(); renderPreview(); },
    onLoginSuccess: () => loadFromUrl(),
  });

  // ── View toggle ──
  document.querySelectorAll('.tb-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      const view = btn.getAttribute('data-view');
      $('tb-app').setAttribute('data-view', view);
      document.querySelectorAll('.tb-toggle button').forEach(b => b.classList.toggle('is-on', b === btn));
      renderPreview();
    });
  });

  // ── Import from PDF ──
  const impBtn = $('btn-import'), impFile = $('import-file');
  if (impBtn && impFile) {
    impBtn.addEventListener('click', () => { if (!impBtn.disabled) impFile.click(); });
    impFile.addEventListener('change', () => {
      const f = impFile.files && impFile.files[0];
      impFile.value = '';
      if (f) importFromPdf(f);
    });
  }

  $('name-input').addEventListener('input', () => tgse.markDirty());

  // ── Load existing tour by ?id ──
  function loadFromUrl() {
    const wId = new URLSearchParams(location.search).get('id');
    if (!wId) { buildForm(); renderPreview(); return; }
    fetch('/api/widget-config?id=' + encodeURIComponent(wId))
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (d && d.config) C = deepMerge(starter(), d.config);
        if (d && d.name) $('name-input').value = d.name;
        buildForm(); renderPreview();
      })
      .catch(() => { tgse.toast('Failed to load tour', 'err'); buildForm(); renderPreview(); });
  }

  // ── Boot — wait for auth to resolve (never sync isLoggedIn at load) ──
  document.addEventListener('DOMContentLoaded', () => {
    if (window.tgse && typeof tgse.onReady === 'function') {
      tgse.onReady(() => { if (tgse.isLoggedIn()) loadFromUrl(); else { buildForm(); renderPreview(); } });
    } else if (tgse.isLoggedIn()) { loadFromUrl(); } else { buildForm(); renderPreview(); }
  });

})();
</script>
