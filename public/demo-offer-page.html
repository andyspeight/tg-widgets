<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Special Offer Page · Travelgenix Widget Suite</title>
<style>
  :root {
    --tg-bg: #F7F9FB; --tg-surface: #FFFFFF; --tg-border: #E2E8F0;
    --tg-text: #0F172A; --tg-sub: #475569; --tg-muted: #94A3B8;
    --tg-brand: #1B2B5B; --tg-accent: #00B4D8; --tg-accent-soft: #E0F4FA;
  }
  [data-theme="dark"] { --tg-bg: #0B1220; --tg-surface: #111B2E; --tg-border: #1E293B; --tg-text: #F1F5F9; --tg-sub: #94A3B8; --tg-muted: #64748B; --tg-accent: #38BDF8; --tg-accent-soft: rgba(56,189,248,0.12); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--tg-bg); color: var(--tg-text); }
  /* Slim demo control strip — clearly the demo chrome, the page below is the real thing */
  .demobar { position: sticky; top: 0; z-index: 100; background: var(--tg-surface); border-bottom: 1px solid var(--tg-border); padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--tg-text); font-weight: 700; font-size: 15px; }
  .brand-mark { width: 24px; height: 24px; background: linear-gradient(135deg, var(--tg-brand), var(--tg-accent)); border-radius: 7px; }
  .pill { padding: 3px 9px; background: var(--tg-accent-soft); color: var(--tg-accent); border-radius: 999px; font-size: 11px; font-weight: 600; }
  .spacer { flex: 1; }
  .demobar label { font-size: 11px; color: var(--tg-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  .demobar select, .demobar input[type=color] { padding: 6px 8px; border: 1px solid var(--tg-border); border-radius: 7px; font-size: 13px; background: var(--tg-surface); color: var(--tg-text); font-family: inherit; }
  .demobar input[type=color] { padding: 3px; width: 38px; height: 32px; cursor: pointer; }
  .ctl { display: flex; align-items: center; gap: 7px; }
  .tlink { color: var(--tg-sub); text-decoration: none; font-size: 13px; }
  .tlink:hover { color: var(--tg-text); }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(140%); z-index: 200; background: #0F172A; color: #fff; padding: 14px 20px; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.3); font-size: 14px; max-width: 90vw; transition: transform 0.4s cubic-bezier(.2,.8,.2,1); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast b { color: #7DD3FC; }
</style>
</head>
<body>
  <div class="demobar">
    <a class="brand" href="/"><span class="brand-mark"></span>Travelgenix</a>
    <span class="pill">Offer Page · Demo</span>
    <span class="spacer"></span>
    <div class="ctl"><label for="ctrlOffer">Offer</label>
      <select id="ctrlOffer">
        <option value="cancun" selected>Cancun · all inclusive</option>
        <option value="maldives">Maldives · luxury honeymoon</option>
        <option value="algarve">Algarve · family villa</option>
        <option value="kruger">Kruger · safari escape</option>
        <option value="sparse">Minimal · few details</option>
      </select>
    </div>
    <div class="ctl"><label for="ctrlTemplate">Template</label>
      <select id="ctrlTemplate">
        <option value="classic" selected>Classic</option>
        <option value="editorial">Editorial</option>
        <option value="immersive">Immersive</option>
        <option value="cruise">Cruise</option>
      </select>
    </div>
    <div class="ctl"><label for="ctrlAccent">Accent</label><input id="ctrlAccent" type="color" value="#00B4D8" /></div>
    <a class="tlink" href="#" id="themeLink">Dark</a>
    <a class="tlink" href="/demo-offer-card">Cards →</a>
  </div>

  <div id="pageMount"></div>
  <div class="toast" id="toast"></div>

  <script src="/widget-maps.js"></script>
  <script src="/widget-offer-page.js"></script>

      },

          bookby: '15 August 2026', reference: 'TG-JNB-0326', protection: 'Both',
          enquiryEmail: 'safari@youragency.co.uk', enquiryPhone: '0161 123 4567',
          mapAddress: 'Sabi Sand Game Reserve, South Africa', mapLat: '-24.8000', mapLng: '31.5000', mapStyle: 'satellite',

          description: 'Four nights of dawn and dusk game drives in the private Sabi Sands, where leopard sightings are among the best in Africa, then fly to Cape Town for five nights at the V&A Waterfront.\nGuided drives, a Table Mountain trip and a Cape winelands day are all included.'
        },

      },
      sparse: {
        currency: 'GBP',
        fields: {
          title: 'Lapland Santa break', type: 'City break', country: 'Finland', resort: 'Rovaniemi',
          nights: '3', price: '799', basis: 'per person', bookby: '', protection: 'ABTA member',
          enquiryPhone: '0161 123 4567',
          description: 'A short magical break to meet Father Christmas in the Arctic Circle.'
        },
        includes: ['Return flights', 'Coach transfers'],
        tags: ['Family friendly']
      }
    };

    let theme = 'light';
    $('themeLink').addEventListener('click', (e) => { e.preventDefault(); theme = theme === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', theme); $('themeLink').textContent = theme === 'dark' ? 'Light' : 'Dark'; render(); });

    let widget = null;
    function render() {
      if (widget && widget.destroy) widget.destroy();
      mount.innerHTML = '';
      const div = document.createElement('div');
      div.setAttribute('data-tg-widget', 'offer-page');
      mount.appendChild(div);
      widget = new window.TGOfferPageWidget(div, {
        theme: theme,
        template: $('ctrlTemplate').value,
        accentColor: $('ctrlAccent').value,
        agencyName: 'Your Travel Co.',
        offer: OFFERS[$('ctrlOffer').value]
      });
      window.scrollTo(0, 0);
    }

    // Show the captured enquiry as a toast so you can see the event payload
    mount.addEventListener('tg-offer-enquiry', (e) => {
      const t = $('toast');
      t.innerHTML = 'Enquiry captured for <b>' + (e.detail.enquiry.name || 'visitor') + '</b> · routed to ' + (e.detail.to || 'the agency');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 4500);
    });

    document.querySelectorAll('.demobar select, .demobar input').forEach(el => el.addEventListener('change', render));
    render();
  </script>
</body>
</html>
