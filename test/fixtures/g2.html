<!doctype html><html><head><meta charset="utf-8"><title>Stripe-style diagonal gradient slab (white text)</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0a2540}
.slab{background:linear-gradient(110deg,#6772e5 0%,#3ecfc0 55%,#a960ee 100%);padding:96px 56px;color:#fff}
.slab .inner{max-width:720px}
.slab .eyebrow{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 14px}
.slab h1{margin:0 0 16px;font-size:50px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.slab p{margin:0 0 28px;font-size:20px;line-height:1.6;color:rgba(255,255,255,.92);max-width:560px}
.cta{display:inline-flex;gap:10px}
.btn{padding:14px 24px;border-radius:9999px;font-weight:700;font-size:16px;text-decoration:none}
.btn-w{background:#fff;color:#5b51e0}
.btn-o{background:rgba(255,255,255,.14);color:#fff}
</style></head><body>
<section class="slab" id="target"><div class="inner">
  <p class="eyebrow">Payments infrastructure</p>
  <h1>Financial tools to grow your revenue</h1>
  <p>Millions of businesses use our platform to accept payments, send payouts and manage their money online.</p>
  <div class="cta"><a class="btn btn-w" href="/start">Start now</a><a class="btn btn-o" href="/contact">Contact sales</a></div>
</div></section>
</body></html>
