<!doctype html><html><head><meta charset="utf-8"><title>CSS-animated gradient hero (keyframes, no JS)</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif}
.hero{padding:96px 48px;text-align:center;color:#fff;background:linear-gradient(120deg,#6ec3f4,#3a3aff,#ff61ab,#e63946);background-size:300% 300%;animation:flow 8s ease-in-out infinite}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero h1{margin:0 0 12px;font-size:48px;font-weight:800}
.hero p{margin:0;font-size:20px;opacity:.95}
</style></head><body>
<section class="hero" id="target"><h1>Animated with pure CSS</h1><p>This gradient moves via keyframes, no JavaScript.</p></section>
</body></html>
