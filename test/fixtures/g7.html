<!doctype html><html><head><meta charset="utf-8"><title>Monzo-style vivid coral gradient + nested phone card</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:#fff}
.hero{display:flex;gap:48px;align-items:center;background:linear-gradient(135deg,#FF4F40,#FF8A5B);padding:72px 56px;color:#fff}
.copy{flex:1}
.copy h1{margin:0 0 14px;font-size:46px;font-weight:800;letter-spacing:-.02em}
.copy p{margin:0 0 24px;font-size:19px;line-height:1.55;max-width:440px;color:rgba(255,255,255,.95)}
.btn{display:inline-block;background:#fff;color:#E5402F;padding:14px 28px;border-radius:12px;font-weight:700;text-decoration:none}
.phone{flex:none;width:240px;background:#fff;border-radius:28px;padding:18px;box-shadow:0 30px 60px -16px rgba(0,0,0,.35)}
.phone .bal{color:#6b7280;font-size:12px;font-weight:600}
.phone .amt{color:#0b1220;font-size:30px;font-weight:800;margin:2px 0 14px}
.phone .tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef0f2;color:#374151;font-size:14px}
.phone .tx b{color:#0b1220}
</style></head><body>
<section class="hero" id="target">
  <div class="copy"><h1>Banking made joyful</h1><p>Spend, save and budget in one app that updates the instant your money moves.</p><a class="btn" href="/join">Open an account</a></div>
  <div class="phone"><div class="bal">Current balance</div><div class="amt">£2,480.50</div><div class="tx"><span>Coffee</span><b>-£3.20</b></div><div class="tx"><span>Salary</span><b>+£2,100</b></div><div class="tx"><span>Groceries</span><b>-£42.10</b></div></div>
</section>
</body></html>
