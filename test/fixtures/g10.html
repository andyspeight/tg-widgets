<!doctype html><html><head><meta charset="utf-8"><title>Dark multi-column footer (dense grid, small type, real divider, social icons)</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0f172a;color:#94a3b8}
.ft{max-width:1120px;margin:0 auto;padding:56px 32px 28px}
.cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.brand h3{margin:0 0 8px;color:#fff;font-size:20px;font-weight:800}
.brand p{margin:0;font-size:14px;line-height:1.6;max-width:240px}
.col h4{margin:0 0 14px;color:#e2e8f0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.col a{display:block;color:#94a3b8;font-size:14px;text-decoration:none;margin:0 0 10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:36px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)}
.bar .cp{font-size:13px}
.social{display:flex;gap:14px}
.social svg{width:20px;height:20px;color:#cbd5e1}
</style></head><body>
<section class="ft" id="target">
  <div class="cols">
    <div class="brand"><h3>Northwind</h3><p>Helping teams plan, book and travel better since 2014.</p></div>
    <div class="col"><h4>Product</h4><a href="#">Overview</a><a href="#">Features</a><a href="#">Pricing</a><a href="#">Integrations</a></div>
    <div class="col"><h4>Company</h4><a href="#">About</a><a href="#">Careers</a><a href="#">Press</a><a href="#">Contact</a></div>
    <div class="col"><h4>Support</h4><a href="#">Help centre</a><a href="#">Status</a><a href="#">Terms</a><a href="#">Privacy</a></div>
  </div>
  <div class="bar"><span class="cp">© 2026 Northwind Ltd</span><span class="social"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 10-11.6 9.9v-7H8v-2.9h2.4V9.8c0-2.4 1.4-3.7 3.6-3.7 1 0 2.1.2 2.1.2v2.3h-1.2c-1.2 0-1.5.7-1.5 1.5v1.8H16l-.4 2.9h-2.3v7A10 10 0 0022 12z"/></svg><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.2 2H21l-6.6 7.5L22 22h-6l-4.7-6.2L5.9 22H3l7-8L2 2h6.2l4.3 5.7L18.2 2z"/></svg><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.5-.1 4.8c-.1 3.2-1.6 4.8-4.9 4.9-1.3.1-1.6.1-4.9.1s-3.6 0-4.9-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.1 15.5 2.1 15.2 2.1 12s0-3.5.1-4.8C2.3 4 3.8 2.4 7.1 2.3 8.4 2.2 8.8 2.2 12 2.2zm0 4.7A5.1 5.1 0 1017.1 12 5.1 5.1 0 0012 6.9zm0 8.4A3.3 3.3 0 1115.3 12 3.3 3.3 0 0112 15.3zm5.3-8.6a1.2 1.2 0 11-1.2-1.2 1.2 1.2 0 011.2 1.2z"/></svg></span></div>
</section>
</body></html>
