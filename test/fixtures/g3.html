<!doctype html><html><head><meta charset="utf-8"><title>Linear-style dark hero (radial glow + glass card + gradient button)</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Inter,sans-serif;background:#08090a}
.hero{position:relative;background:radial-gradient(900px 360px at 50% -10%,rgba(120,120,255,.22),transparent 70%),#08090a;padding:104px 48px;text-align:center}
.hero h1{margin:0 0 16px;font-size:52px;font-weight:600;letter-spacing:-.02em;color:#f7f8f8}
.hero p{margin:0 auto 28px;max-width:560px;font-size:19px;line-height:1.6;color:#8a8f98}
.btn{display:inline-block;padding:12px 22px;border-radius:9px;font-weight:600;font-size:15px;color:#fff;text-decoration:none;background:linear-gradient(180deg,#7b8cff,#5b6cff);box-shadow:0 10px 30px -8px rgba(91,108,255,.7)}
.card{max-width:640px;margin:48px auto 0;padding:24px;border-radius:14px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);text-align:left}
.card h3{margin:0 0 6px;color:#f7f8f8;font-size:17px;font-weight:600}
.card p{margin:0;color:#8a8f98;font-size:14px}
</style></head><body>
<section class="hero" id="target">
  <h1>Built for modern teams</h1>
  <p>Streamline issues, projects and product roadmaps in one place that feels fast.</p>
  <a class="btn" href="/start">Get started</a>
  <div class="card"><h3>Keyboard-first</h3><p>Every action a shortcut away, so you stay in flow.</p></div>
</section>
</body></html>
