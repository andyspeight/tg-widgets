<!doctype html><html><head><meta charset="utf-8"><title>Notion-style minimal feature rows (light)</title><style>
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif;background:#fff;color:#37352f}
.wrap{max-width:760px;margin:0 auto;padding:64px 24px}
.wrap h2{margin:0 0 36px;font-size:40px;font-weight:700;letter-spacing:-.01em}
.row{display:flex;gap:16px;align-items:flex-start;margin-bottom:26px}
.row .ic{flex:none;width:40px;height:40px;border-radius:8px;background:#f1f1ef;display:flex;align-items:center;justify-content:center}
.row .ic svg{width:22px;height:22px;color:#37352f}
.row h3{margin:0 0 3px;font-size:18px;font-weight:600}
.row p{margin:0;font-size:15px;color:#787774;line-height:1.5}
</style></head><body>
<section class="wrap" id="target">
  <h2>One workspace. Every team.</h2>
  <div class="row"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div><div><h3>Docs</h3><p>Write, plan and organise in flexible pages.</p></div></div>
  <div class="row"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16"/></svg></div><div><h3>Databases</h3><p>Turn anything into a sortable, filterable table.</p></div></div>
  <div class="row"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div><div><h3>Reminders</h3><p>Never lose track of what matters next.</p></div></div>
</section>
</body></html>
