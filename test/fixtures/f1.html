<!doctype html><html><head><meta charset="utf-8"><style>
  *,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
  body{margin:0;font-family:system-ui,sans-serif;background:#fff;padding:40px}
  .band{display:flex;flex-direction:column;align-items:center;max-width:1200px;margin:0 auto}
  .band h2{margin:0 0 8px;color:#0b3d63;font-size:34px;font-weight:800}
  .band p.sub{margin:0 0 28px;color:#5b6b7a;font-size:18px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%}
  .card{background:#f2f6f8;border-radius:10px;padding:24px 16px;text-align:center}
  .card svg{width:64px;height:64px;color:#0b3d63;margin-bottom:12px}
  .card .lbl{color:#1f2937;font-size:15px;font-weight:600;line-height:1.4}
</style></head><body>
  <section class="band" id="target">
    <h2>Book with confidence</h2>
    <p class="sub">We're with you every step of the way</p>
    <div class="grid">
      <div class="card"><svg aria-hidden="true"><use href="sprite.svg#ic-check"></use></svg><div class="lbl">ATOL Protected</div></div>
      <div class="card"><svg aria-hidden="true"><use href="sprite.svg#ic-globe"></use></svg><div class="lbl">Worldwide choice</div></div>
      <div class="card"><svg aria-hidden="true"><use href="sprite.svg#ic-shield"></use></svg><div class="lbl">Secure payments</div></div>
      <div class="card"><svg aria-hidden="true"><use href="sprite.svg#ic-star"></use></svg><div class="lbl">4.9/5 rated</div></div>
    </div>
  </section>
</body></html>
