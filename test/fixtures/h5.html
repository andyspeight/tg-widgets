<!doctype html><html><head><meta charset="utf-8"><title>Dark stats band + newsletter form (big numbers, input + button)</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.sec{background:linear-gradient(120deg,#0b1220,#15233f 60%,#0a3b46);color:#fff;padding:64px 40px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:980px;margin:0 auto 48px}
.stat{text-align:center;padding:0 12px}
.stat:not(:last-child){border-right:1px solid rgba(255,255,255,.14)}
.stat .n{font-size:44px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#00B4D8,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{margin-top:6px;color:#9fb3c8;font-size:14px}
.cta{max-width:620px;margin:0 auto;text-align:center}
.cta h3{margin:0 0 8px;font-size:28px;font-weight:800}
.cta p{margin:0 0 20px;color:#9fb3c8;font-size:16px}
.form{display:flex;gap:10px;justify-content:center}
.form input{flex:1;max-width:340px;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:15px}
.form button{background:#00B4D8;color:#04282b;border:0;padding:14px 24px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
</style></head><body>
<section class="sec" id="target">
  <div class="stats">
    <div class="stat"><div class="n">300+</div><div class="l">Travel businesses</div></div>
    <div class="stat"><div class="n">6</div><div class="l">Countries</div></div>
    <div class="stat"><div class="n">99.9%</div><div class="l">Uptime</div></div>
    <div class="stat"><div class="n">4.9/5</div><div class="l">Customer rating</div></div>
  </div>
  <div class="cta"><h3>Get travel tech tips monthly</h3><p>One useful email a month. No noise, unsubscribe any time.</p><div class="form"><input type="email" placeholder="you@agency.com"><button>Subscribe</button></div></div>
</section>
</body></html>
