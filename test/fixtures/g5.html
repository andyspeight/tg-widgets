<!doctype html><html><head><meta charset="utf-8"><title>Airbnb-style listing cards (image + coral accent + rating)</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Circular,-apple-system,system-ui,sans-serif;background:#fff;color:#222}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1120px;margin:0 auto;padding:48px 24px}
.card .imgwrap{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1/1}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .heart{position:absolute;top:12px;right:12px;width:26px;height:26px;color:#FF385C}
.card .top{display:flex;justify-content:space-between;margin:12px 0 2px}
.card .ttl{font-weight:600;font-size:15px}
.card .rate{font-size:14px}
.card .loc{color:#717171;font-size:14px;margin:0 0 6px}
.card .price{font-size:14px}
.card .price b{font-weight:700}
</style></head><body>
<section class="grid" id="target">
  <div class="card"><div class="imgwrap"><img src="g-img1.jpg" alt=""><svg class="heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.6-9.3-9C1 8.5 2.7 5.5 6 5.5c2 0 3.2 1.2 4 2.3.8-1.1 2-2.3 4-2.3 3.3 0 5 3 3.3 6.5C19 16.4 12 21 12 21z"/></svg></div><div class="top"><span class="ttl">Santorini villa</span><span class="rate">★ 4.95</span></div><p class="loc">Oia, Greece</p><p class="price"><b>£240</b> night</p></div>
  <div class="card"><div class="imgwrap"><img src="g-img2.jpg" alt=""><svg class="heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.6-9.3-9C1 8.5 2.7 5.5 6 5.5c2 0 3.2 1.2 4 2.3.8-1.1 2-2.3 4-2.3 3.3 0 5 3 3.3 6.5C19 16.4 12 21 12 21z"/></svg></div><div class="top"><span class="ttl">Coastal retreat</span><span class="rate">★ 4.88</span></div><p class="loc">Amalfi, Italy</p><p class="price"><b>£310</b> night</p></div>
  <div class="card"><div class="imgwrap"><img src="g-img3.jpg" alt=""><svg class="heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.6-9.3-9C1 8.5 2.7 5.5 6 5.5c2 0 3.2 1.2 4 2.3.8-1.1 2-2.3 4-2.3 3.3 0 5 3 3.3 6.5C19 16.4 12 21 12 21z"/></svg></div><div class="top"><span class="ttl">Forest cabin</span><span class="rate">★ 4.92</span></div><p class="loc">Bavaria, Germany</p><p class="price"><b>£175</b> night</p></div>
</section>
</body></html>
