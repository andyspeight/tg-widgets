<!doctype html><html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,serif;background:#fff}
  .hero{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 60%,#0ea5b7 100%);padding:80px 48px;text-align:center}
  .hero h1{margin:0 0 16px;color:#fff;font-size:52px;font-weight:800;letter-spacing:-.02em}
  .hero p{margin:0 auto 32px;max-width:560px;color:#cbd5e1;font-size:20px;line-height:1.6}
  .btns{display:flex;gap:16px;justify-content:center}
  .btn{padding:16px 28px;border-radius:10px;font-size:17px;font-weight:700;text-decoration:none}
  .btn-primary{background:#13c2c2;color:#04282b;box-shadow:0 16px 30px rgba(19,194,194,.4)}
  .btn-ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6)}
</style></head><body>
  <section class="hero" id="target">
    <h1>Your next adventure starts here</h1>
    <p>Handpicked holidays, real human support, and prices that work. From your first idea to your final sunset.</p>
    <div class="btns">
      <a class="btn btn-primary" href="/quote">Get a quote</a>
      <a class="btn btn-ghost" href="/how">How it works</a>
    </div>
  </section>
</body></html>
