<!doctype html><html><head><meta charset="utf-8"><title>WebGL/canvas-style moving background (JS-painted)</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif}
.hero{position:relative;padding:96px 48px;text-align:center;color:#fff;background:#0b1220}
#cv{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero .in{position:relative;z-index:1}
.hero h1{margin:0 0 12px;font-size:48px;font-weight:800}
</style></head><body>
<section class="hero" id="target"><canvas id="cv"></canvas><div class="in"><h1>Painted by JavaScript</h1><p>Like Stripe's WebGL gradient.</p></div></section>
<script>
var c=document.getElementById('cv'),x=c.getContext('2d');c.width=1200;c.height=400;
function pa(t){var g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,'#6ec3f4');g.addColorStop(0.5,'#3a3aff');g.addColorStop(1,'#ff61ab');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);}
pa(0);
</script>
</body></html>
